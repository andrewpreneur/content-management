<title>V8 Animated (example-reel grammar)</title>
<style>
@font-face{font-family:'InterB';src:url('../../tools/fonts/Inter-Bold.woff');font-weight:700}
@font-face{font-family:'InterS';src:url('../../tools/fonts/Inter-SemiBold.woff');font-weight:600}
@font-face{font-family:'ISerif';src:url('../../tools/fonts/InstrumentSerif-Italic.ttf');font-style:italic}
#stage{background:#000}
#vig{position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 52%,rgba(0,0,0,.42) 100%)}
/* hook header: plain line + accent phrase in a brand-blue box (saraev) */
#hd{position:absolute;left:0;top:150px;width:1080px;text-align:center;z-index:8;transform-origin:50% 0}
#hd .l1{font-family:'InterB';font-size:66px;color:#fff;letter-spacing:-.01em;text-shadow:0 3px 18px rgba(0,0,0,.55)}
#hd .l2{display:inline-block;margin-top:14px;position:relative;padding:6px 26px 12px}
#hd .box{position:absolute;inset:0;background:#2E7DFF;border-radius:14px;box-shadow:0 10px 40px rgba(46,125,255,.35)}
#hd .l2 span.t{position:relative;font-family:'ISerif';font-style:italic;font-size:96px;color:#fff;line-height:1}
#hd .w{display:inline-block;white-space:pre}
/* phrase-build captions */
#cap{position:absolute;left:40px;width:1000px;top:1250px;text-align:center;z-index:9;font-family:'InterB';font-size:66px;line-height:1.08;color:#fff;letter-spacing:-.01em;text-shadow:0 4px 20px rgba(0,0,0,.7)}
#cap .w{display:inline-block;white-space:pre;transform-origin:50% 70%}
#cap .acc{font-family:'ISerif';font-style:italic;font-size:80px;color:#FFD23F;letter-spacing:0}
#cap .neg{color:#FF6B5E}
/* big beats (gp): small lead-in + huge key word */
.bb{position:absolute;left:0;width:1080px;text-align:center;z-index:10}
.bb .ld{font-family:'InterB';font-size:56px;color:#fff;text-shadow:0 3px 16px rgba(0,0,0,.6);margin-bottom:-6px}
.bb .ky{font-family:'Inter Tight';font-weight:800;line-height:.95;letter-spacing:-.02em;white-space:nowrap}
.bb .ky b{display:inline-block;font-weight:800}
.bb .tl{font-family:'InterB';font-size:52px;color:#fff;text-shadow:0 3px 16px rgba(0,0,0,.6);margin-top:4px}
.gy{background:linear-gradient(180deg,#FFE27A 0%,#FFC21A 55%,#FF9F1C 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.gb{background:linear-gradient(180deg,#9CCBFF 0%,#4C9BFF 50%,#2E7DFF 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.gr{background:linear-gradient(180deg,#FFB0A6 0%,#FF6B5E 60%,#F0443A 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sh{filter:drop-shadow(0 6px 22px rgba(0,0,0,.55))}
/* glass callout chips (gp "Real Leads") */
.chip{position:absolute;z-index:9;display:flex;align-items:center;gap:16px;padding:16px 30px 16px 18px;border-radius:999px;background:rgba(255,255,255,.16);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:2px solid rgba(255,255,255,.42);box-shadow:0 14px 40px rgba(0,0,0,.35);white-space:nowrap}
.chip .ic{width:64px;height:64px;border-radius:50%;background:#FFD23F;display:flex;align-items:center;justify-content:center}
.chip span{font-family:'InterS';font-size:44px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.35)}
.bd{position:absolute;z-index:8;width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.35)}
/* handwritten name note + arrow (DOAC) */
.note{position:absolute;z-index:9;font-family:'ISerif';font-style:italic;font-size:76px;color:#fff;white-space:nowrap;text-shadow:0 3px 14px rgba(0,0,0,.6)}
.note svg{position:absolute;overflow:visible}
#scrim{position:absolute;left:-200px;width:1480px;height:760px;z-index:4;pointer-events:none;background:radial-gradient(50% 50% at 50% 50%,rgba(0,0,0,.5) 0%,rgba(0,0,0,.28) 45%,rgba(0,0,0,0) 75%)}
#tag{position:absolute;left:44px;top:60px;z-index:8;font-family:'InterB';font-size:26px;letter-spacing:.1em;color:#0B0F1A;background:#FFD23F;padding:9px 16px;border-radius:10px}
</style>
<script>
const CLIP=/*CLIP*/null;
//@include lib.js
const P=CLIP.v8, Th=CLIP.Th; const FULL=[0,0,1080,1920];
const IC8={users:['M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2','M5 7a4 4 0 1 0 8 0a4 4 0 1 0-8 0','M22 21v-2a4 4 0 0 0-3-3.87','M16 3.13a4 4 0 0 1 0 7.75'],
 dollar:['M12 2v20','M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6'], clock:M.IC.clock, bolt:['M13 2 3 14h9l-1 8 10-12h-9l1-8z'],
 video:['M16 13l5.2 3.1a.5.5 0 0 0 .8-.4V8.3a.5.5 0 0 0-.8-.4L16 11','M4 6h10a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z'],
 bank:['M3 22h18','M6 18v-7','M10 18v-7','M14 18v-7','M18 18v-7','M12 2 20 7H4z'], heart:['M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z'],
 layers:['m12 2 10 5-10 5L2 7z','m2 12 10 5 10-5','m2 17 10 5 10-5'], briefcase:['M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16','M4 6h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z'],
 trend:['M22 7 13.5 15.5 8.5 10.5 2 17','M16 7h6v6'], mail:['M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z','m22 7-10 6L2 7'],
 cap:['M22 10 12 5 2 10l10 5 10-5z','M6 12v5c3 3 9 3 12 0v-5'], star:['M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z']};
Object.assign(M.IC,IC8);
const v=View(2); el('div','','').id='vig'; const vig=$('vig'); stage.appendChild(vig);
const tag=el('div','',CLIP.brand); tag.id='tag';
// ---- hook header: last 1–3 words go in the blue box
const hq=(CLIP.hook_q||CLIP.hook_plain||'').trim(); const hw=hq.split(/\s+/); const nAcc=hw.length>=6?3:hw.length>=3?2:1;
const l1w=hw.slice(0,hw.length-nAcc), l2w=hw.slice(hw.length-nAcc);
const HD=el('div','',`<div class="l1">${l1w.map(w=>`<span class="w">${w} </span>`).join('')}</div><div class="l2"><div class="box"></div><span class="t">${l2w.map(w=>`<span class="w">${w} </span>`).join('')}</span></div>`); HD.id='hd';
const hdW=[...HD.querySelectorAll('.w')]; const box=HD.querySelector('.box');
const HDT=Math.max(Th,2.2); const hdIn=hdW.map((_,i)=>0.08+i*Math.min(0.16,1.1/hdW.length)); const boxIn=hdIn[l1w.length]+0.04;
// ---- captions: phrase build
const PH=phrases(4,0.55); const cap=el('div','',''); cap.id='cap';
PH.forEach(p=>{p.html=p.w.map(w=>{const tx=clean(w[0]); const c=w[2]===2?'w neg':w[2]===1?'w acc':'w'; return `<span class="${c}">${tx} </span>`;}).join('');});
// ---- big beats
const scrim=el('div','',''); scrim.id='scrim';
const BB=P.beats.map((b,i)=>{
  const g=b.col==='r'?'gr':b.col==='b'?'gb':'gy'; const len=b.key.length; const size=b.num?Math.min(300,Math.floor(1000/(0.64*Math.max(len,2)))):Math.min(len<=5?260:220,Math.floor(1000/(0.66*Math.max(len,3))));
  const d=el('div',`top:${b.num?930:1010}px`,`${b.lead?`<div class="ld">${b.lead}</div>`:''}<div class="ky sh" style="font-size:${size}px">${b.num?`<b class="${g}">${b.key}</b>`:[...b.key].map(ch=>`<b class="${g}">${ch===' '?'&nbsp;':ch}</b>`).join('')}</div>${b.tail?`<div class="tl">${b.tail}</div>`:''}`);
  d.className='bb'; d._ld=d.querySelector('.ld'); d._ky=d.querySelector('.ky'); d._ch=[...d.querySelectorAll('.ky b')]; d._tl=d.querySelector('.tl'); return d;});
const inBeat=t=>P.beats.findIndex(b=>t>=b.s-0.02&&t<b.e+0.1);
// ---- chips + bursts + notes
const CH=P.chips.map(c=>{const d=el('div','',`<div class="ic">${M.icon(c.icon,38,'#0B0F1A',2.6)}</div><span>${c.label}</span>`); d.className='chip'; return d;});
const BU=P.bursts.map(b=>[0,1,2,3,4].map(k=>{const d=el('div',`background:${k%2?'#2E7DFF':'#FF4D6D'}`,M.icon(b.icon,46,'#fff',2.6)); d.className='bd'; return d;}));
const NT=P.notes.map(n=>{const d=el('div','',`<span>${n.text}</span><svg width="10" height="10" style="left:40px;top:70px"><path d="M10 0 C 30 70, 110 110, 190 90 M190 90 L164 78 M190 90 L170 110" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg>`); d.className='note'; d._p=d.querySelector('path'); return d;});
// ---- camera: speaker framing per segment, punch-in spring on every big beat, slow drift
const SH=CLIP.v8shots; const shotAt=t=>{let k=SH[0]; for(const s of SH) if(t>=s[0]) k=s; return k;};
const zoom=M.track(1,P.beats.flatMap(b=>[[b.s,1.13,[16,0.72]],[b.e,1.0,[9,0.95]]]));
const lastDip=(t)=>{let f=0; for(const r of P.racks){const d=t-r; if(d>-0.14&&d<0.2) f=Math.max(f,1-Math.abs(d-0.0)/(d<0?0.14:0.2));} return f;};
scene(t=>{
  // video
  const k=shotAt(t); const z=zoom(t)*(1+0.012*Math.min(6,t-k[0])); const rack=lastDip(t);
  let gray=0; if(P.bw){gray=M.clamp((t-P.bw[0])/0.08)*(1-M.clamp((t-P.bw[1])/0.15));}
  // during a beat the face rides a little higher so the word sits on the chest
  const bi=inBeat(t); const lift=bi>=0?M.S(t-P.beats[bi].s,14,0.85)*(1-M.clamp((t-P.beats[bi].e)/0.2)):0;
  const sw0=Math.min(k[3],IH*1080/1920,IW); v.set(FULL,[k[1],k[2]-sw0*0.03*lift,sw0/z],`contrast(1.05) saturate(${(1.08*(1-gray)).toFixed(3)})${gray>0.01?` grayscale(${gray.toFixed(3)})`:''}${rack>0.02?` blur(${(16*rack).toFixed(1)}px)`:''}`);
  // tag after the hook
  M.apply(tag,M.vis(t,HDT+0.1,null));
  // header
  const hdOut=M.vis(t,null,HDT,{lout:0.18});
  if(M.apply(HD,hdOut)){ hdW.forEach((w,i)=>{const a=M.S(t-hdIn[i],20,0.8); w.style.opacity=M.clamp((t-hdIn[i])/0.1).toFixed(3); w.style.filter=a<0.98?`blur(${(10*(1-a)).toFixed(1)}px)`:'none'; w.style.transform=`translateY(${(18*(1-a)).toFixed(1)}px)`;});
    const u=M.eo((t-boxIn)/0.32); box.style.clipPath=`inset(0 ${(100*(1-u)).toFixed(1)}% 0 0 round 14px)`; }
  // captions (hidden while a big beat is up)
  const p=at(PH,t); if(!p||t>LAST||bi>=0||t<0.05){cap.style.display='none';} else { cap.style.display='';
    if(cap._p!==p){cap._p=p; cap.innerHTML=p.html; cap._w=[...cap.querySelectorAll('.w')];}
    cap._w.forEach((s,i)=>{const ws=p.w[i][1]; if(t<ws-0.02){s.style.opacity='0';return;} const a=M.S(t-ws+0.02,24,0.62); s.style.opacity=M.clamp((t-ws+0.02)/0.07).toFixed(3);
      s.style.transform=`scale(${(0.84+0.16*a).toFixed(4)}) translateY(${(10*(1-Math.min(1,a))).toFixed(1)}px)`; s.style.filter=a<0.95?`blur(${(8*(1-Math.min(1,a))).toFixed(1)}px)`:'none';
      const live=wordAt(t)===p.w[i]; s.style.color=live&&!s.classList.contains('acc')&&!s.classList.contains('neg')?'#fff':''; s.style.textShadow=live?'0 0 26px rgba(255,255,255,.35),0 4px 20px rgba(0,0,0,.7)':'';});
    const end=p.e; cap.style.opacity=(1-M.clamp((t-end+0.06)/0.08)).toFixed(3);}
  // big beats
  {let o=0,top=1000; P.beats.forEach(b=>{const x=M.clamp((t-b.s)/0.15)*(1-M.clamp((t-b.e)/0.2)); if(x>o){o=x; top=(b.num?930:1010)-150;}}); scrim.style.opacity=o.toFixed(3); scrim.style.top=top+'px'; scrim.style.display=o>0.01?'':'none';}
  BB.forEach((d,i)=>{const b=P.beats[i]; const vv=M.vis(t,b.s-0.02,b.e,{din:0,lin:0.12,lout:0.14,blur:14}); if(!M.apply(d,vv)) return;
    if(d._ld){const a=M.S(t-b.s,20,0.75); d._ld.style.transform=`translateY(${(20*(1-a)).toFixed(1)}px)`; d._ld.style.opacity=M.clamp((t-b.s)/0.1).toFixed(3);}
    const t0=b.k-0.04;
    if(b.num){const u=M.eo((t-t0)/0.6); const val=b.num*u; const ch=d._ch[0]; const base=b.key.replace(/[\d,.]+/,'#');
      ch.textContent=base.replace('#',(b.num>=100?Math.round(val).toLocaleString('en-US'):(u>=1?String(b.num):val.toFixed(0))));
      const a=M.S(t-t0,18,0.55); ch.style.transform=`scale(${(0.6+0.4*a).toFixed(4)})`; ch.style.opacity=M.clamp((t-t0)/0.06).toFixed(3);}
    else d._ch.forEach((ch,j)=>{const tj=t0+j*0.028; const a=M.S(t-tj,22,0.62); ch.style.opacity=M.clamp((t-tj)/0.06).toFixed(3);
      ch.style.transform=`translateY(${(40*(1-a)).toFixed(1)}px) scale(${(1.25-0.25*a).toFixed(4)})`; ch.style.filter=a<0.97?`blur(${(12*Math.max(0,1-a)).toFixed(1)}px)`:'none';});
    if(d._tl){const a=M.S(t-b.k-0.25,20,0.8); d._tl.style.opacity=M.clamp((t-b.k-0.25)/0.1).toFixed(3); d._tl.style.transform=`translateY(${(16*(1-a)).toFixed(1)}px)`;}
    d.style.transform+=` translateY(${(-14*M.clamp((t-b.k)/(b.e-b.k))).toFixed(1)}px)`;
  });
  // chips: pop in beside the speaker
  CH.forEach((d,i)=>{const c=P.chips[i]; const vv=M.vis(t,c.t,c.e,{din:0,lin:0.1,lout:0.16}); if(!M.apply(d,vv)) return;
    const a=M.S(t-c.t,17,0.6); const w=d.offsetWidth; const x=c.side==='r'?1080-w-56:56; d.style.left=x+'px'; d.style.top=(780+(c.side==='r'?0:60))+'px';
    d.style.transform=`translateY(${(30*(1-a)).toFixed(1)}px) scale(${(0.55+0.45*a).toFixed(4)}) rotate(${((c.side==='r'?-3:3)*(1-a)).toFixed(2)}deg)`; d.style.transformOrigin=c.side==='r'?'100% 50%':'0 50%';});
  // bursts: badges spring out from behind the speaker, drift up, fade
  BU.forEach((ds,i)=>{const b=P.bursts[i]; ds.forEach((d,k)=>{const tk=b.t+k*0.06; const dt=t-tk; if(dt<0||dt>1.3){d.style.display='none';return;} d.style.display='';
    const a=M.S(dt,14,0.6); const ang=(-150+k*30)*Math.PI/180; const R=300+40*(k%2); const x=540+Math.cos(ang)*R*1.25*a-46, y=1240+Math.sin(ang)*R*0.55*a-46-90*dt;
    d.style.left=x.toFixed(1)+'px'; d.style.top=y.toFixed(1)+'px'; d.style.opacity=(M.clamp(dt/0.06)*(1-M.clamp((dt-0.9)/0.4))).toFixed(3); d.style.transform=`scale(${(0.3+0.7*Math.min(1.1,a)).toFixed(3)}) rotate(${((k-2)*8).toFixed(1)}deg)`;});});
  // name notes
  NT.forEach((d,i)=>{const n=P.notes[i]; const vv=M.vis(t,n.t,n.e,{lin:0.2}); if(!M.apply(d,vv)) return; d.style.left='60px'; d.style.top='560px';
    d._p.setAttribute('stroke-dashoffset',(1-M.eo((t-n.t-0.15)/0.45)).toFixed(3));});
});
</script>
