<title>V6 Serious crop</title>
<style>
#stage{background:#000}
.wd{position:absolute;font-family:'Geist',sans-serif;font-weight:400;color:#fff;font-size:44px;z-index:8;white-space:nowrap;text-shadow:0 2px 10px rgba(0,0,0,.55)}
.tag{position:absolute;z-index:8;font-family:'Inter Tight';font-weight:800;font-size:17px;color:#000;background:#fff;padding:2px 6px;letter-spacing:.03em}
</style>
<script>
const CLIP=/*CLIP*/null;
//@include lib.js
const BOX=[0,430,1080,1060]; const v=View(2);
const tag=el('div',`left:28px;top:${BOX[1]+BOX[3]-50}px`,CLIP.brand); tag.className='tag';
const cam=shots(CLIP.shots.v6,0.02); const grade='contrast(1.18) saturate(0.7) brightness(0.8) sepia(0.12) hue-rotate(-8deg)';
const P=phrases(5,0.7); const pool=[]; for(let i=0;i<6;i++){const d=el('div','',''); d.className='wd'; pool.push(d);}
const SLOT=[[90,560],[400,560],[700,560],[150,630],[470,630],[760,630]], SL3=[[130,600],[440,600],[740,600]];
scene(t=>{
  v.set(BOX,cam(t),grade); const ph=at(P,t);
  pool.forEach((d,i)=>{ const w=ph&&t<=LAST?ph.w[i]:null; if(!w||t<w[1]){d.style.display='none';return;}
    d.style.display=''; M.setText(d,clean(w[0]).toLowerCase()); const p=M.clamp((t-w[1])/0.12); const o=(ph.w.length<=3?SL3:SLOT)[i];
    d.style.left=o[0]+'px'; d.style.top=o[1]+'px'; d.style.opacity=p.toFixed(3); d.style.filter=p<1?`blur(${(4*(1-p)).toFixed(2)}px)`:'none';});
});
</script>
