<title>Pod3 V3 — Kinetic typography, words behind the speaker (gp multimedia style)</title>
<style>
@font-face{font-family:'Inter Tight';src:url('../../tools/fonts/InterTight-ExtraBold.ttf');font-weight:800}
@font-face{font-family:'Playfair';src:url('../../tools/fonts/PlayfairDisplay-BoldItalic.ttf');font-style:italic;font-weight:700}
#stage{background:#000}
.big{position:absolute;left:0;width:1080px;text-align:center;font-family:'Inter Tight';font-weight:800;line-height:.9;white-space:nowrap;letter-spacing:-.02em;transform-origin:50% 50%}
.big i{font-family:'Playfair';font-style:italic;font-weight:700;letter-spacing:0}
.sm{position:absolute;left:0;width:1080px;text-align:center;font-family:'Geist',sans-serif;font-weight:600;font-size:42px;color:#fff;z-index:9;text-shadow:0 2px 12px rgba(0,0,0,.6)}
#flash{position:absolute;inset:0;background:#fff;z-index:12;pointer-events:none}
</style>
<script>
//@include pod3-lib.js
const FULL=[0,0,1080,1920];
const v=View(2);          // the shot
const cut=View(5,null,true); // the people again, masked: anything at z 3-4 sits BEHIND them
const O=SPK.ohaji, B=SPK.blonde;
const OR='#FF8A1F', BL='#2F8CFF', CY='#43E8FF', RD='#FF3B30', GR='#2BD46B', WH='#FFFFFF';
// beats: [start, end, shot [cx,cy,sw], items]; item = [html, y, size, colour, behind?, extra-css]
const BEATS=[
 [0.00,1.24,[O[0],O[1]+250,1250],[['I’ve grown',560,96,WH,0],['<i>more</i>',700,170,OR,0]]],
 [1.24,2.44,[O[0],O[1]+230,1050],[['2',520,560,OR,1],['MONTHS',930,120,WH,0]]],
 [2.44,3.46,[O[0]+60,O[1]+260,1300],[['in the',520,80,WH,0],['INTERNSHIP',640,130,BL,1]]],
 [3.46,4.46,[O[0],O[1]+220,980],[['4',520,560,BL,1],['YEARS OF COLLEGE',930,92,WH,0]]],
 [4.46,5.14,[O[0],O[1]+200,860],[['this is',520,84,WH,0],['INSANE',660,190,CY,0,'text-shadow:0 0 40px rgba(67,232,255,.8)']]],
 [5.14,7.40,[O[0]-40,O[1]+260,1200],[['how',470,80,WH,0],['REAL LIFE',600,170,OR,1],['works',780,80,WH,0]]],
 [7.40,8.46,[O[0],O[1]+240,1000],[['FAILURE',600,230,'transparent',1,'-webkit-text-stroke:5px #fff']]],
 [8.46,9.98,[O[0]+40,O[1]+260,1250],[['taught in',520,84,WH,0],['SCHOOL',650,200,BL,1]]],
 [9.98,10.88,[O[0],O[1]+220,950],[['failure is',520,88,WH,0],['BAD',680,260,RD,0]]],
 [10.88,11.96,[O[0]-20,O[1]+230,1050],[['F',560,640,RD,1],['get that',980,80,WH,0]]],
 [11.96,13.14,[O[0]+20,O[1]+230,1050],[['A',560,640,GR,1],['aim for the',980,80,WH,0]]],
 [13.14,13.94,[O[0],O[1]+200,880],[['BUT',620,300,WH,0]]],
 [13.94,15.06,[O[0]-30,O[1]+250,1150],[['what I',520,84,WH,0],['<i>learned</i>',660,170,OR,1]]],
 [15.06,16.50,[O[0],O[1]+230,1000],[['YOU FAIL',540,150,RD,1],['KEEP GOING',700,130,CY,0]]],
 [16.50,18.06,[O[0]+30,O[1]+250,1200],[['YOU FAIL',540,150,RD,1],['GET BACK UP',700,130,OR,0]]],
 [18.06,18.92,[O[0],O[1]+210,900],[['failure is',520,88,WH,0],['GOOD',660,260,GR,1]]],
 [18.92,20.52,[O[0]-30,O[1]+250,1150],[['a chance to',520,84,WH,0],['<i>learn</i>',680,210,BL,1]]],
 [20.52,21.57,[O[0],O[1]+220,980],[['THAT IS',540,110,WH,0],['LIFE',700,250,OR,1]]],
 [21.57,22.80,[B[0],B[1]+260,1150],[['fail',540,120,WH,0],['MORE',690,220,RD,1]]],
 [22.80,24.0,[B[0],B[1]+230,950],[['fail',540,120,WH,0],['<i>faster.</i>',710,220,OR,1]]],
];
const WHIP=[4.46,7.40,13.14,21.57], FLASH=[4.46,13.14,21.57];
// build text layers
const layers=BEATS.map(b=>b[3].map(([h,y,sz,c,beh,css])=>{const d=el('div',`top:${y-sz*0.45}px;font-size:${sz}px;color:${c};z-index:${beh?3:7};${css||''}`,h); d.className='big'; return d;}));
const sm=el('div','top:1250px',''); sm.className='sm';
const flash=el('div','',''); flash.id='flash';
const seek0=M.scene({W:1080,H:1920,T:T,bg:'#000',intro:null,SH:{n:{w:1,h:1,r:0,bg:'#000',cam:1}},start:'n',SEQ:[],layers:[],
 extra:(t)=>{
  let bi=0; BEATS.forEach((b,i)=>{if(t>=b[0]) bi=i;}); const b=BEATS[bi];
  // camera: spring from previous beat's framing to this one (punch-ins), whip = blur + overshoot
  const prev=BEATS[Math.max(0,bi-1)][2]; const u=bi===0?1:M.S(t-b[0],22,0.72);
  let win=[0,1,2].map(k=>prev[k]+(b[2][k]-prev[k])*u); win[2]*=1-0.02*Math.min(3,t-b[0]);
  let blur=0, shake=0;
  for(const w of WHIP){const d=t-w; if(d>-0.08&&d<0.16){blur=Math.max(blur,18*(1-Math.abs(d-0.02)/0.14)); win[0]+=(d<0?-1:1)*240*Math.max(0,1-Math.abs(d)/0.12);}}
  if(bi===4) shake=Math.sin(t*90)*6*Math.max(0,1-(t-4.46)/0.5);
  const f=`contrast(1.06) saturate(1.12)${blur>0.3?` blur(${blur.toFixed(1)}px)`:''}`;
  v.set(FULL,win,f); cut.set(FULL,win,f);
  stage.style.transform=shake?`translate(${shake.toFixed(1)}px,${(-shake*0.6).toFixed(1)}px)`:'';
  // text: pop in with overshoot + blur, out quickly
  layers.forEach((ls,i)=>{const [s,e]=BEATS[i]; ls.forEach((d,j)=>{const tin=s+j*0.12; const vis=t>=tin-0.01&&t<e+0.08;
    if(!vis){d.style.display='none';return;} d.style.display='';
    const a=M.S(t-tin,20,0.6), o=M.clamp((t-tin)/0.07)*(1-M.clamp((t-e)/0.08));
    d.style.opacity=o.toFixed(3); d.style.transform=`scale(${(1.35-0.35*a).toFixed(4)})`;
    const bl=Math.max(0,(1-M.clamp((t-tin)/0.12))*10); d.style.filter=bl>0.2?`blur(${bl.toFixed(1)}px)`:'none';});});
  // small white caption word, like the reference
  const w=wordAt(t); if(!w||t>LAST){sm.style.display='none';} else {sm.style.display=''; M.setText(sm,clean(w[0]).toLowerCase());}
  let fl=0; for(const x of FLASH){const d=t-x; if(d>=-0.03&&d<0.2) fl=Math.max(fl,1-Math.max(0,d)/0.2);} flash.style.opacity=fl.toFixed(3); flash.style.display=fl>0.01?'':'none';
 }});
install(seek0);
</script>
