<title>Pod3 V6 — Serious cropped frame, scattered lowercase words</title>
<style>
@font-face{font-family:'Inter Tight';src:url('../../tools/fonts/InterTight-ExtraBold.ttf');font-weight:800}
#stage{background:#000}
.wd{position:absolute;font-family:'Geist',sans-serif;font-weight:400;color:#fff;font-size:44px;z-index:8;white-space:nowrap;text-shadow:0 2px 10px rgba(0,0,0,.55);letter-spacing:.005em}
.tag{position:absolute;z-index:8;font-family:'Inter Tight';font-weight:800;font-size:17px;color:#000;background:#fff;padding:2px 6px;letter-spacing:.03em}
</style>
<script>
//@include pod3-lib.js
// near-square frame centred on black, dark moody grade, words appear one by one on a loose grid and clear per phrase
const BOX=[0,430,1080,1060]; const v=View(2);
const tag=el('div',`left:28px;top:${BOX[1]+BOX[3]-50}px`,'HIGHLEVEL'); tag.className='tag';
const O=SPK.ohaji, B=SPK.blonde;
const cam=shots([[0,O[0]+40,O[1]+260,1500],[9.98,O[0],O[1]+200,1150],[18.06,O[0],O[1]+180,1000],[SWITCH,B[0]-80,B[1]+240,1300]],0.02);
const grade='contrast(1.18) saturate(0.7) brightness(0.8) sepia(0.12) hue-rotate(-8deg)';
const P=phrases(5,0.7);
const pool=[]; for(let i=0;i<6;i++){const d=el('div','',''); d.className='wd'; pool.push(d);}
// loose positions: 3 per line, 2 lines, upper third of the frame
const SLOT=[[90,560],[400,560],[700,560],[150,630],[470,630],[760,630]];
const seek0=M.scene({W:1080,H:1920,T:T,bg:'#000',intro:null,SH:{n:{w:1,h:1,r:0,bg:'#000',cam:1}},start:'n',SEQ:[],layers:[],
 extra:(t)=>{
  v.set(BOX,cam(t),grade);
  const ph=at(P,t);
  pool.forEach((d,i)=>{ const w=ph&&t<=LAST?ph.w[i]:null; if(!w||t<w[1]){d.style.display='none';return;}
    d.style.display=''; M.setText(d,clean(w[0]).toLowerCase()); const p=M.clamp((t-w[1])/0.12);
    const off=(ph.w.length<=3)?[[130,600],[440,600],[740,600]][i]:SLOT[i];
    d.style.left=off[0]+'px'; d.style.top=off[1]+'px'; d.style.opacity=p.toFixed(3); d.style.filter=p<1?`blur(${(4*(1-p)).toFixed(2)}px)`:'none';});
 }});
install(seek0);
</script>
