  <svg id="cursor" viewBox="0 0 13 20"><path d="M1 1 L1 16.5 L4.8 12.9 L7.4 18.8 L9.9 17.7 L7.4 12 L12.3 12 Z" fill="#000" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/></svg>
</div>
<!-- HUD sits outside the beat-pulsed world -->
<div id="hud">
  <div class="br" style="left:13px;top:13px;border-left-width:1.5px;border-top-width:1.5px"></div>
  <div class="hud" style="left:27px;top:20px">CLIMBX</div>
  <div class="br" style="left:1257px;top:13px;border-right-width:1.5px;border-top-width:1.5px"></div>
  <div class="hud" id="tr" style="right:27px;top:20px;text-align:right"></div>
  <div class="br" style="left:13px;top:697px;border-left-width:1.5px;border-bottom-width:1.5px"></div>
  <div class="hud" id="tc" style="left:27px;top:690px"></div>
  <div class="br" style="left:1257px;top:697px;border-right-width:1.5px;border-bottom-width:1.5px"></div>

<script>
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eOutCubic=t=>1-Math.pow(1-clamp(t),3);
const eOutQuart=t=>1-Math.pow(1-clamp(t),4);
const eInCubic=t=>Math.pow(clamp(t),3);
const eInOutSine=t=>-(Math.cos(Math.PI*clamp(t))-1)/2;
// damped spring: displacement from rest, x0 start offset, v0 start velocity (units/s), z damping ratio, w natural freq (rad/s)
function spring(tau,x0,v0,z,w){if(tau<=0)return x0;const wd=w*Math.sqrt(1-z*z);return Math.exp(-z*w*tau)*(x0*Math.cos(wd*tau)+(v0+z*w*x0)/wd*Math.sin(wd*tau));}
function springV(tau,x0,v0,z,w){const h=1/240;return (spring(tau+h,x0,v0,z,w)-spring(tau-h,x0,v0,z,w))/(2*h);}
// seeded rng
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};

// ---------- build headline letters ----------
const HL="make it yours.";const hl=$('hl');const letters=[];let li=0;
[...HL].forEach((ch,i)=>{const s=document.createElement('span');s.textContent=ch;if(i>=8)s.className='o';hl.appendChild(s);if(ch!==' '){letters.push({el:s,j:li++});}else s.style.width='';});
const KICK="STUDIO";const kick=$('kick');const kl=[...KICK].map(c=>{const s=document.createElement('span');s.textContent=c;kick.appendChild(s);return s});
// rating rows
const ROWS=[["Not selling",97],["Not bait",98],["Has substance",93],["Specific",89],["Room to reply",89]];
const rowsEl=$('rows');const rows=ROWS.map(([lab,p],r)=>{const y=50+30*r;const d=document.createElement('div');
 d.innerHTML=`<div class="rlab" style="top:${y-3}px">${lab}</div><div class="trk" style="top:${y+2}px"><div class="fill"></div></div><div class="rpct" style="top:${y-2}px">${p}%</div>`;
 rowsEl.appendChild(d);return {lab:d.children[0],fill:d.children[1].firstChild,pct:d.children[2],p}});
// confetti
const CFC=['#17a04b','#17a04b','#7fd3b0','#ff692f','#e5484d','#2f8f5b'];const conf=[];
for(let i=0;i<18;i++){const e=document.createElement('div');e.className='cf';const sz=2+rnd()*3.2;const rect=rnd()<.35;
 e.style.width=(rect?sz*.7:sz)+'px';e.style.height=(rect?sz*1.9:sz)+'px';if(rect)e.style.borderRadius='1px';e.style.background=CFC[Math.floor(rnd()*CFC.length)];
 $('conf').appendChild(e);const a=rnd()*Math.PI*2;conf.push({e,a,sp:45+rnd()*85,rot:rnd()*360,vr:(rnd()-.5)*600,g:30+rnd()*50,delay:rnd()*0.05,sz});}

// typing data: right ink edge of typed text per frame (reference measurement), frames 16..43
const L2="Share the call you reversed. It teaches more than any",L3="screenshot.",FULL=L2+' '+L3;
const EXT2={16:186,17:215,18:232,19:261,20:287,21:304,22:319,23:351,24:368,25:399,26:422,27:447,28:460,29:477,30:501,31:526,32:550,33:587,34:606,35:624,36:655,37:677,38:696,39:725,40:756};
const EXT3={41:254,42:283};
const cv=document.createElement('canvas').getContext('2d');
let pre2=[],pre3=[],preF=[];
function prefixes(s){cv.font='400 20.7px IN';const a=[];for(let n=0;n<=s.length;n++)a.push(cv.measureText(s.slice(0,n)).width);return a}
function countFor(pre,ext,str){const target=ext-179.5;let best=0;for(let n=0;n<pre.length;n++){if(str[n-1]===' ')continue;if(Math.abs(pre[n]-target)<Math.abs(pre[best]-target))best=n}return best}
const OLD2="A decision you changed your mind about is more useful than",OLD3="another progress screenshot.";
const SCR="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789/";
function scramble(str,p,salt){let o='';const n=str.length;for(let i=0;i<n;i++){const c=str[i];if(c===' '||c==='/'){o+=c;continue}
 const reveal=i/n<p*1.15-0.15;o+=reveal?c:(p<=0?'':SCR[(Math.floor(p*40)+i*7+salt)%SCR.length]);}return o}

window.render=function(t){
  const f=t*30;
  if(!pre2.length){pre2=prefixes(L2);pre3=prefixes(L3);preF=prefixes(FULL);}
  // ---- beat pulse (every 0.5 s) ----
  const tb=t-Math.floor(t/0.5+1e-6)*0.5;const pulse=1+0.0095*Math.exp(-tb/0.085);
  $('world').style.transform=`scale(${pulse})`;
  // ---- HUD ----
  const hudOn=f>=2;$('hud').style.opacity=hudOn?1:0;
  $('tr').textContent=scramble("02 / STUDIO",clamp((f-2)/8),3);
  const gf=Math.round(t*30)+360;$('tc').textContent=`00:00:${String(Math.floor(gf/30)).padStart(2,'0')}:${String(gf%30).padStart(2,'0')}`;
  // ---- kicker letters rise ----
  kl.forEach((s,j)=>{const st=(3.8+j*0.9)/30;const p=clamp((t-st)/0.12);s.style.opacity=clamp((t-st)/0.07);s.style.transform=`translateY(${(1-eOutCubic(p))*9}px)`});
  // ---- headline letters: spring rise ----
  letters.forEach(({el,j})=>{const st=0.169+0.0453*j;const tau=t-st;
    if(tau<=0){el.style.opacity=0;return}
    const y=spring(tau,73.5,-628,0.47,15.9);const v=springV(tau,73.5,-628,0.47,15.9);
    el.style.opacity=clamp(tau/0.07);
    el.style.transform=`translateY(${y}px) rotate(${y*0.18}deg)`;
    const bl=Math.min(3.5,Math.abs(v)/260);el.style.filter=bl>0.15?`blur(${bl}px)`:'none';});
  // ---- editor card intro (zoom settle + horizontal motion blur) ----
  const ed=$('ed');
  let edT='',edBlur=0,edOp=1;
  {const k=21.6;const s=1+0.32*Math.exp(-k*t);const dsdt=0.32*k*Math.exp(-k*t);
   const ox=-71-100,oy=358-194; // scale origin in card coords
   edT=`translate(${ox}px,${oy}px) scale(${s}) translate(${-ox}px,${-oy}px)`;edBlur=Math.max(0,4.2*(1-t*30/6.5));}
  ed.style.transformOrigin='0 0';
  // ---- editor exit (f103-f114): tilt back + drift right + blur + fade ----
  const te=t-3.43;
  if(te>0){const p=te/0.38;const e=eInCubic(p);ed.style.transformOrigin='50% 50%';
    edT=`perspective(900px) translate(${e*220}px,${-e*40}px) rotateX(${e*60}deg) rotateY(${-e*8}deg)`;
    edBlur=Math.max(edBlur,clamp((p-0.45)/0.55)*16);edOp=1-clamp((p-0.78)/0.4);}
  ed.style.transform=edT;ed.style.opacity=edOp;
  $('mbEdG').setAttribute('stdDeviation',`${edBlur} ${te>0?edBlur*0.6:0}`);ed.style.filter=edBlur>0.2?'url(#mbEd)':'none';
  // header row fades in (present from start)
  // ---- old text + highlight + delete ----
  const typing=f>=15;
  $('hlA').style.width=(f<15?eOutCubic((f-7.7)/4.3)*287:0)+'px';
  $('hlB').style.width=(f<15?eOutCubic((f-7.7)/4.3)*287:0)+'px';
  let s2='',s3='';
  if(f<15){s2=OLD2;s3=OLD3}
  else{const fi=Math.floor(f+1e-6);
    if(fi<=15){s2=''}
    else if(fi<=40){s2=FULL.slice(0,countFor(preF,EXT2[fi],FULL))}
    else{s2=L2;s3=fi>=43?L3:L3.slice(0,countFor(pre3,EXT3[fi],L3))}}
  $('l2').textContent=s2;$('l3').textContent=s3;
  // caret
  const car=$('caret');const fi=Math.floor(f+1e-6);
  let cOn=false,cA=1;
  if(fi>=15&&fi<=42){cOn=true;cA=0.45}else if(fi>=48){cOn=((fi-48)%16)<8}
  car.style.opacity=cOn?cA:0;
  {cv.font='400 20.7px IN';const line3=s3.length>0||fi>=41;const w=cv.measureText(line3?s3:s2).width;
   car.style.left=(79+w+2)+'px';car.style.top=(line3?127:97)+'px';}
  // ---- footer buttons pop ----
  [['bSave',4.6],['bPosted',6.4],['bSched',7.8],['bPost',10.2]].forEach(([id,fs])=>{const p=clamp((f-fs)/4.5);
    const sc=p<=0?0:1+spring(p*0.15,-1,0,0.6,30)*1;const e=$(id);e.style.opacity=clamp((f-fs)/1.5);e.style.transform=`scale(${Math.max(0,sc)})`});
  // ---- rating card ----
  const rt=$('rt');const tr0=1.2595;
  if(t<tr0-0.04){rt.style.opacity=0}else{rt.style.opacity=1;const tau=t-tr0;const x=spring(tau,358,0,0.78,23.8);const v=springV(tau,358,0,0.78,23.8);
    const te2=t-3.72;const op=te2>0?1-clamp(te2/0.22):1;rt.style.opacity=op;
    rt.style.transform=`translate(${x}px,${te2>0?eInCubic(te2/0.25)*30:0}px)`;
    const b=Math.min(30,Math.abs(v)/30*0.45);$('mbRtG').setAttribute('stdDeviation',`${b+(te2>0?te2*20:0)} ${te2>0?te2*20:0}`);rt.style.filter=(b>0.2||te2>0)?'url(#mbRt)':'none';}
  $('rtitle').textContent=scramble("POST RATING",clamp((f-39)/6),5);
  rows.forEach((r,i)=>{const st=1.483+0.1333*i;const p=t>st?1-Math.exp(-16.9*(t-st)):0;
    r.fill.style.width=(p*r.p/100*132)+'px';
    r.lab.style.opacity=clamp((t-st-0.05)/0.1);
    const ps=clamp((t-st)/0.14);r.pct.style.opacity=clamp((t-st)/0.05);r.pct.textContent=Math.round(r.p*p)+'%';
    r.pct.style.transform=`scale(${0.55+0.45*eOutCubic(ps)})`;});
  // ---- Ready-to-post pill ----
  const pill=$('pill');const tp=t-1.985;
  if(tp<0){pill.style.opacity=0}else{
    let sc,rot;const f0=tp*30;
    if(f0<6.5){sc=lerp(2.25,0.67,eInOutSine(f0/6.5))}else{sc=1+spring((f0-6.5)/30,-0.33,0,0.3,11.5)}
    rot=6+spring(tp,-30,0,0.5,14);
    const dS=f0<6.5?1.6/6.5:0;const bl=Math.max(0,(1-f0/4.5))*2.6;
    pill.style.opacity=clamp(0.55+f0*0.45);
    pill.style.transform=`rotate(${rot}deg) scale(${sc})`;pill.style.filter=bl>0.2?`blur(${bl}px)`:'none';}
  // pill exits with editor
  if(te>0){const e=eInCubic(te/0.38);pill.style.transform+=` translate(${e*150}px,${-e*40}px)`;pill.style.opacity=1-clamp((te/0.38-0.5)/0.4);pill.style.filter=`blur(${e*10}px)`}
  // ring
  const ring=$('ring');const tr1=f-60.5;
  if(tr1<0){ring.style.opacity=0}else{const r=150*(1-Math.exp(-tr1/3.2));ring.style.opacity=0.9*(1-clamp(tr1/13));
    ring.style.left=(749-r)+'px';ring.style.top=(190-r)+'px';ring.style.width=ring.style.height=2*r+'px';}
  // confetti
  conf.forEach(c=>{const tc=t-2.04-c.delay;if(tc<0){c.e.style.opacity=0;return}
    const d=c.sp*(1-Math.exp(-tc*7))/1;const x=749+Math.cos(c.a)*d*1.25;const y=190+Math.sin(c.a)*d+c.g*tc*tc;
    c.e.style.opacity=clamp(1-(tc-0.45)/0.45)*(te>0?0:1);c.e.style.transform=`translate(${x}px,${y}px) rotate(${c.rot+c.vr*tc}deg)`});
  // ---- cursor ----
