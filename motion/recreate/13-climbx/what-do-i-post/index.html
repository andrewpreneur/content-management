<!doctype html><html><head><meta charset="utf-8"><title>ClimbX 1.5-5.5s recreation</title><style>
@font-face{font-family:HL;src:url(../fonts/InterVariable-opsz-wght-latin.woff2);font-weight:100 900}
@font-face{font-family:IN;src:url(../fonts/Inter-500.ttf);font-weight:500}
@font-face{font-family:IN;src:url(../fonts/Inter-600.ttf);font-weight:600}
@font-face{font-family:JB;src:url(../fonts/JetBrainsMono-500.ttf);font-weight:500}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#06060e}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform:scale(1.5);transform-origin:0 0;overflow:hidden;background:#06060e}
.layer{position:absolute;inset:0;overflow:hidden}
.abs{position:absolute}
/* ---- dark intro ---- */
#dark{background:#06060e}
#glow{position:absolute;left:306px;top:0;width:660px;height:660px;border-radius:50%;
  background:radial-gradient(circle,#4a1d0a 0%,#3d1909 22%,#2f1409 38%,#22100b 52%,#170d0d 66%,#0e0a10 82%,rgba(6,6,14,0) 100%)}
#ring0{position:absolute;border-radius:50%;border:3px solid rgba(200,200,205,.35)}
/* ---- orange field ---- */
#orange{background:radial-gradient(ellipse 72% 78% at 50% 47%,#ff8a4c 0%,#ff7a33 10%,#fe6a1c 20%,#fe6210 34%,#f05b10 50%,#e05410 62%,#d24b0b 75%,#c3440a 88%,#b33c06 100%)}
.card{position:absolute;left:0;top:0;transform-origin:0 0;background:#fdf6f0;border-radius:9px;box-shadow:0 8px 16px rgba(120,40,0,.16),0 1px 2px rgba(120,40,0,.12)}
.card .avt{position:absolute;left:14px;top:12px;width:18px;height:18px;border-radius:50%;background:#e2ddd9}
.card .ln{position:absolute;left:40px;top:19px;width:72px;height:4px;border-radius:2px;background:#e6e0dc}
.card .tt{position:absolute;left:17px;top:47px;font:600 15.5px IN;color:#8f8c92;white-space:nowrap;letter-spacing:-.1px}
.card .tt i{display:inline-block;width:1.5px;height:17px;background:#ff6a2f;margin-left:6px;vertical-align:-3px}
#words{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:640px 365px}
.w{position:absolute;top:304px;font:800 103px HL;font-variation-settings:'opsz' 32;letter-spacing:-0.04em;color:#fff;white-space:pre;line-height:120px;transform-origin:50% 55%}
#iris{position:absolute;left:0;top:0;width:0;height:0;border-radius:50%;overflow:hidden}
/* ---- light logo ---- */
#light{background:radial-gradient(ellipse farthest-corner at 50% 51%,#f9f9f9 0%,#f8f8f8 53%,#d0d0d0 100%)}
.lt{position:absolute;top:243px;font:900 120px HL;font-variation-settings:'opsz' 32;letter-spacing:-0.035em;color:#111;white-space:pre;line-height:130px;transform-origin:50% 70%}
#tag{position:absolute;left:391px;top:441px;font:700 42px HL;font-variation-settings:'opsz' 28;letter-spacing:-0.035em;color:#111;white-space:pre}
#tag b{color:#ff6a2f;font-weight:800}
.hud{position:absolute;font:500 9.6px JB;letter-spacing:2.4px;white-space:nowrap}
.br{position:absolute;width:9px;height:9px;border-style:solid;border-width:0}
</style></head><body>
<div id="stage">
 <!-- dark intro -->
 <div class="layer" id="dark">
   <canvas id="stars" width="1280" height="720" class="abs" style="left:0;top:0"></canvas>
   <div id="zoomwrap" class="layer"></div>
 </div>
 <template id="mtTpl">
   <div class="layer mt" style="transform-origin:624px 372px"><div class="grp layer" style="transform-origin:636px 290px">
     <div class="glowc" style="position:absolute;left:306px;top:0;width:660px;height:660px;border-radius:50%;background:radial-gradient(circle,#4a1d0a 0%,#3d1909 22%,#2f1409 38%,#22100b 52%,#170d0d 66%,#0e0a10 82%,rgba(6,6,14,0) 100%)"></div>
     <svg class="abs" width="1280" height="720" viewBox="0 0 1280 720" style="left:0;top:0;overflow:visible">
       <defs><clipPath class="fillclip" clipPathUnits="userSpaceOnUse"><rect class="fillrect" x="0" y="522" width="1280" height="300"/></clipPath></defs>
       <polyline class="mline" points="" fill="none" stroke="#ff6a1f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
       <g class="mfill"><polygon points="403,522 470,462 505,478 636,308 712,402 742,384 866,522" fill="#efece6"/>
         <g class="facets"><polygon points="636,308 600,372 640,360 668,470 712,402" fill="#0d0e1a"/><polygon points="742,384 730,440 760,420 790,470 866,522 800,450" fill="#0d0e1a"/><polygon points="470,462 455,505 500,490" fill="#0d0e1a"/></g></g>
       <rect x="632" y="203" width="9" height="108" rx="4.5" fill="#ff6a1f"/>
       <path d="M641 210 C670 200 690 222 720 214 C735 210 748 214 759 222 C745 230 734 240 718 244 C690 252 668 238 641 248 Z" fill="#ff6a1f"/>
     </svg>
   </div></div>
 </template>
 <!-- orange field -->
 <div class="layer" id="orange"><div id="cards"></div><div id="words"></div></div>
 <!-- iris close to dark -->
 <div class="layer" id="irisL" style="background:#06060e"><div id="iris"><div id="irisBands" class="abs"></div><div id="irisWords" class="abs" style="left:0;top:0;width:1280px;height:720px;z-index:20"></div></div><div id="dot" class="abs" style="width:10px;height:10px;border-radius:50%;background:#ff6a1f;box-shadow:0 0 14px 6px rgba(255,106,31,.25)"></div></div>
 <!-- light logo -->
 <div class="layer" id="light">
   <svg id="burst" class="abs" width="1280" height="720" style="left:0;top:0"></svg>
   <canvas id="parts" width="1280" height="720" class="abs" style="left:0;top:0"></canvas>
   <div id="logo" class="layer" style="transform-origin:640px 330px">
     <svg id="icon" class="abs" width="203" height="120" viewBox="0 0 160 120" preserveAspectRatio="none" style="left:314px;top:262px;transform-origin:100px 70px">
       <path d="M2 98 L44 54 L52 62 L76 40 L96 66 L104 58 L148 98 L120 92 L106 76 L96 84 L80 66 L70 82 L58 70 L40 92 Z" fill="#3b3c40"/>
       <path d="M76 40 L84 52 L78 50 L72 60 L70 52 L64 58 Z" fill="#fff"/>
       <path d="M2 98 L148 98 L136 94 L40 92 Z" fill="#3b3c40"/>
       <rect x="73" y="7" width="6" height="36" rx="2" fill="#ff6a1f"/>
       <path d="M79 9 C90 6 98 12 110 10 L120 9 C113 15 110 19 104 22 C96 26 88 21 79 25 Z" fill="#ff6a1f"/>
     </svg>
     <div id="ltx"></div>
     <div id="tag">your growth co-pilot for <b>X</b>.</div>
   </div>
 </div>
 <!-- HUD (orange + iris sections) -->
 <div id="hud">
  <div class="br" style="left:13px;top:13px;border-left-width:1.5px;border-top-width:1.5px"></div>
  <div class="hud" style="left:27px;top:20px">CLIMBX</div>
  <div class="br" style="left:1257px;top:13px;border-right-width:1.5px;border-top-width:1.5px"></div>
  <div class="hud" style="right:27px;top:20px">THE BLANK PAGE</div>
  <div class="br" style="left:13px;top:697px;border-left-width:1.5px;border-bottom-width:1.5px"></div>
  <div class="hud" id="tc" style="left:27px;top:690px"></div>
  <div class="br" style="left:1257px;top:697px;border-right-width:1.5px;border-bottom-width:1.5px"></div>
  <div class="hud" style="right:27px;top:690px">CLIMBX.SO</div>
 </div>
</div>
<script>
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eOutCubic=t=>1-Math.pow(1-clamp(t),3);
const eOutExpo=t=>{t=clamp(t);return t>=1?1:1-Math.pow(2,-10*t)};
const eInCubic=t=>Math.pow(clamp(t),3);
function spring(tau,x0,v0,z,w){if(tau<=0)return x0;const wd=w*Math.sqrt(1-z*z);return Math.exp(-z*w*tau)*(x0*Math.cos(wd*tau)+(v0+z*w*x0)/wd*Math.sin(wd*tau));}
let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
// stars
{const c=$('stars').getContext('2d');for(let i=0;i<70;i++){c.fillStyle=`rgba(255,255,255,${.15+rnd()*.35})`;c.beginPath();c.arc(rnd()*1280,rnd()*720,.5+rnd()*.9,0,7);c.fill();}}
// mountain copies (main + 3 ghost trails for the zoom)
const mts=[];for(let k=0;k<4;k++){const n=$('mtTpl').content.firstElementChild.cloneNode(true);const id='fc'+k;n.querySelector('.fillclip').id=id;n.querySelector('.mfill').setAttribute('clip-path',`url(#${id})`);$('zoomwrap').appendChild(n);mts.push(n)}
mts.reverse(); // mts[0] drawn last = main
const ring0=document.createElement('div');ring0.id='ring0';$('zoomwrap').appendChild(ring0);
// line mountain base geometry (peak at 636,308)
const LINE=[[403,522],[470,462],[505,478],[636,308],[712,402],[742,384],[866,522]];
// ---- cards: base rect at local frame 28 (camera u=0): x,y,w,h,rot,opacity,caret,fontScale
const CARDS=[
[218,50,254,115,0.6,1,1],[352,197,118,62,0,0.72,0],[505,165,182,90,1.5,1,1],[649,130,142,68,-3,1,0],[566,273,155,73,0,1,1],
[900,139,126,52,0,0.72,0],[884,192,173,50,0,0.95,0],[821,222,192,85,0,1,1],[972,234,170,82,3,0.97,0],[1172,133,150,113,3,0.97,0],
[251,418,152,72,-2,1,0],[407,534,120,68,2,1,1],[834,548,157,75,0,1,0],[960,481,170,110,-6,0.97,0],[1025,516,248,115,4,1,0],[720,705,250,90,-2,1,0],[150,640,180,80,3,0.95,0]];
const cardEls=CARDS.map(c=>{const e=document.createElement('div');e.className='card';
  const sc=c[2]/254;e.innerHTML=`<div style="position:absolute;left:0;top:0;width:254px;height:${c[3]/sc}px;transform:scale(${sc});transform-origin:0 0"><div class="avt"></div><div class="ln"></div><div class="tt" style="top:${c[3]/sc/2-11}px">What's happening?${c[6]?'<i></i>':''}</div></div>`;
  e.style.width=c[2]+'px';e.style.height=c[3]+'px';if(c[5]<1)e.style.background=`rgba(253,240,230,${c[5]})`;$('cards').appendChild(e);return e});
const CX=630,CY=365;
function camU(f){return 0.0098*(f-28)+0.00018*Math.pow(Math.max(0,f-50),3)}
// ---- words ----
const WORDS=[['what',156,14.5],['do',408,22.5],['I',545,32],['post',590,38.5],['today?',811,45]];
function mkWords(parent){return WORDS.map(([w,x])=>{const e=document.createElement('div');e.className='w';e.textContent=w;e.style.left=x+'px';parent.appendChild(e);return e})}
const wEls=mkWords($('words'));const wEls2=mkWords($('irisWords'));
// iris bands
{const b=$('irisBands');const cols=['#fe6a1c','#f05c14','#d9500f','#bf450c','#a03a0c','#7d2e0d','#5a210c','#3a160c'];
 cols.forEach((c,i)=>{const d=document.createElement('div');d.className='band';d.style.cssText=`position:absolute;border-radius:50%;background:${c}`;b.appendChild(d)});}
// ---- logo letters ----
const ltBox=document.createElement('div');ltBox.className='lt';ltBox.style.left='538px';$('ltx').appendChild(ltBox);
const ltEls=[...'ClimbX'].map(c=>{const e=document.createElement('span');e.style.display='inline-block';e.textContent=c;ltBox.appendChild(e);return e});
// burst rays + rings
const BX=412,BY=318;
{const s=$('burst');let h='';for(let i=0;i<22;i++)h+=`<line class="ray" stroke="#ff7a3c" stroke-width="2.4" stroke-linecap="round"/>`;h+=`<circle id="bR1" fill="none" stroke="#ff8a50" stroke-width="2"/><circle id="bR2" fill="none" stroke="#e9e9e9" stroke-width="9"/><circle id="bR3" fill="none" stroke="#e2e2e2" stroke-width="1.5"/>`;s.innerHTML=h;}
const rays=[...document.querySelectorAll('.ray')].map((e,i)=>({e,a:i/22*Math.PI*2+rnd()*0.2,l:.6+rnd()*.5}));
const PARTS=[];for(let i=0;i<70;i++){const a=rnd()*Math.PI*2;PARTS.push({a,sp:80+rnd()*260,sz:1+rnd()*2.6,c:rnd()<.55?'#ff6a2f':(rnd()<.5?'#2b2b30':'#9a9aa0'),d:rnd()*0.08,rect:rnd()<.4,rot:rnd()*6})}

window.render=function(t){
  const f=t*30;
  const show=(id,on)=>{$(id).style.display=on?'block':'none'};
  show('dark',f<12.5);show('orange',f>=12.5&&f<68.5);show('irisL',f>=68.5&&f<74.5);show('light',f>=74.5);
  // HUD
  const hudOn=f>=14.5&&f<74.5;$('hud').style.display=hudOn?'block':'none';
  const hc=f<68.5?'rgba(255,225,205,.8)':'rgba(190,190,200,.75)';document.querySelectorAll('#hud .hud').forEach(e=>e.style.color=hc);document.querySelectorAll('#hud .br').forEach(e=>e.style.borderColor=hc);
  const gf=Math.round(f)+45;$('tc').textContent=`00:00:${String(Math.floor(gf/30)).padStart(2,'0')}:${String(gf%30).padStart(2,'0')}`;
  // ===== dark intro =====
  if(f<12.5){
    const zs=f<8.3?1:Math.exp(0.41*(f-8.3));
    mts.forEach((m,k)=>{const fk=f-k*0.45;const s=fk<8.3?1:Math.exp(0.41*(fk-8.3));
      m.style.display=(k===0||f>8.6)?'block':'none';m.style.opacity=k===0?1:[1,.45,.28,.16][k];
      m.style.transform=`scale(${k===0?zs:s})`;
      const sl=1+0.45*Math.exp(-f/1.2);m.querySelector('.grp').style.transform=`scale(${sl})`;
      m.querySelector('.mline').setAttribute('points',LINE.map(([x,y])=>`${x},${y}`).join(' '));
      m.querySelector('.mline').style.opacity=1-clamp((f-3)/2);
      const fill=clamp((f-1.6)/3.4);m.querySelector('.fillrect').setAttribute('y',lerp(530,295,eOutCubic(fill)));
      m.querySelector('.facets').style.opacity=clamp((f-6.5)/1.5);
      m.querySelector('.glowc').style.opacity=k===0?1:0;});
    const r=78+222*(1-Math.exp(-f/1.4));const bw=lerp(30,3,clamp(f/2.5));ring0.style.cssText=`position:absolute;border-radius:50%;border:${bw}px solid rgba(200,200,205,${.3*(1-clamp((f-4)/4))});background:${f<1.5?'repeating-radial-gradient(circle,rgba(200,200,205,.12) 0 2px,rgba(0,0,0,0) 2px 5px)':'none'};left:${636-r}px;top:${(f<2?lerp(445,330,clamp(f/2)):330)-r}px;width:${2*r}px;height:${2*r}px`;
    ring0.style.transform=`scale(${zs})`;ring0.style.transformOrigin=`${624-636+r}px ${372-330+r}px`;
    // orange flood at end of zoom
    $('dark').style.background=f>11.5?`rgb(${lerp(6,254,clamp(f-11.5))},${lerp(6,98,clamp(f-11.5))},${lerp(14,16,clamp(f-11.5))})`:'#06060e';
  }
  // ===== orange field =====
  if(f>=12.5&&f<68.5){
    const u=camU(f);const cardsOn=f>=14.5;
    CARDS.forEach((c,i)=>{const e=cardEls[i];if(!cardsOn){e.style.display='none';return}
      const q=c[2]/254;const den=1-u*q;if(den<0.12){e.style.display='none';return}e.style.display='block';
      const s=1/den;const x=CX+(c[0]-CX)*s,y=CY+(c[1]-CY)*s;
      e.style.transform=`translate(${x}px,${y}px) rotate(${c[4]}deg) scale(${s})`;
      const bl=Math.max(0,(s-1.5))*2.2+(q<0.6?1.0:0.6);e.style.filter=`blur(${bl}px)`;e.style.opacity=(f<15.5?clamp(f-14.5):1)*(1-clamp((f-63.5)/2.5));});
    // words
    const ws=1/(1-camU(f)*0.035);$('words').style.transform=`scale(${ws})`;
    wordAnim(wEls,f);
    const rgb=clamp((f-61)/5);$('words').style.filter=rgb>0?`drop-shadow(${-3*rgb}px 0 0 rgba(255,40,60,.55)) drop-shadow(${3*rgb}px 0 0 rgba(60,220,255,.55)) blur(${rgb*1.2}px)`:'none';
  }
  // ===== iris =====
  if(f>=68.5&&f<74.5){
    const R=f<71?[640,283,6][Math.round(f)-69]||640:5;
    const ir=$('iris');ir.style.left=(640-R)+'px';ir.style.top=(365-R)+'px';ir.style.width=ir.style.height=2*R+'px';
    [...$('irisBands').children].forEach((d,i)=>{const rr=R*(1-i*0.075);d.style.left=(R-rr)+'px';d.style.top=(R-rr)+'px';d.style.width=d.style.height=2*rr+'px';d.style.zIndex=i});
    $('irisBands').style.transform='none';
    // bands drawn outer->inner: reverse colours so centre is brightest
    [...$('irisBands').children].forEach((d,i,arr)=>{d.style.background=['#3a160c','#5a210c','#7d2e0d','#a03a0c','#bf450c','#d9500f','#f05c14','#fe6a1c'][i]});
    $('irisWords').style.left=(R-640)+'px';$('irisWords').style.top=(R-365)+'px';
    const ws=1/(1-camU(68)*0.035)*(1+0.04*(f-68.5));$('irisWords').style.transform=`scale(${ws})`;$('irisWords').style.transformOrigin='640px 365px';
    wordAnim(wEls2,60);$('irisWords').style.filter=`drop-shadow(-4px 0 0 rgba(255,40,60,.6)) drop-shadow(4px 0 0 rgba(60,220,255,.6)) blur(3px)`;$('irisWords').style.opacity=.8;
    $('iris').style.display=R>8?'block':'none';
    const dot=$('dot');dot.style.display=f>=70.5?'block':'none';dot.style.left='635px';dot.style.top='360px';
  }
  // ===== light / logo =====
  if(f>=74.5){
    const g=f-75;
    // rays
    rays.forEach(r=>{const p=clamp((g+1)/7);const r1=20+200*eOutCubic(p)*r.l,r2=r1+60*(1-p)+25;const o=(1-clamp((g-3)/4))*0.75;
      r.e.setAttribute('x1',BX+Math.cos(r.a)*r1);r.e.setAttribute('y1',BY+Math.sin(r.a)*r1);r.e.setAttribute('x2',BX+Math.cos(r.a)*r2);r.e.setAttribute('y2',BY+Math.sin(r.a)*r2);r.e.setAttribute('opacity',o)});
    const R1=lerp(120,360,eOutCubic((g+1)/10));const c1=$('bR1');c1.setAttribute('cx',BX);c1.setAttribute('cy',BY);c1.setAttribute('r',R1);c1.setAttribute('opacity',0.6*(1-clamp((g-2)/10)));
    const R2=lerp(55,130,eOutCubic((g-2)/9));const c2=$('bR2');c2.setAttribute('cx',BX);c2.setAttribute('cy',BY);c2.setAttribute('r',R2);c2.setAttribute('stroke-width',lerp(10,2,clamp((g-3)/8)));c2.setAttribute('opacity',g<2?0:(1-clamp((g-10)/12)));
    const c3=$('bR3');c3.setAttribute('cx',BX);c3.setAttribute('cy',BY);c3.setAttribute('r',lerp(130,330,eOutCubic((g-8)/14)));c3.setAttribute('opacity',g<8?0:.8*(1-clamp((g-14)/14)));
    // particles
    const pc=$('parts').getContext('2d');pc.clearRect(0,0,1280,720);
    PARTS.forEach(p=>{const tt=t-2.53-p.d;if(tt<0)return;const d=p.sp*(1-Math.exp(-tt*3.2))/3.2*2.2;const x=BX+Math.cos(p.a)*d,y=BY+Math.sin(p.a)*d*0.8+18*tt;
      const o=clamp(1-(tt-0.7)/0.8);if(o<=0)return;pc.globalAlpha=o;pc.fillStyle=p.c;pc.save();pc.translate(x,y);pc.rotate(p.rot+tt*3);
      if(p.rect)pc.fillRect(-p.sz*.4,-p.sz,p.sz*.8,p.sz*2);else{pc.beginPath();pc.arc(0,0,p.sz*.8,0,7);pc.fill()}pc.restore()});
    pc.globalAlpha=1;
    // icon
    const ic=$('icon');const is=g<8?lerp(2.0,0.55,(1-Math.cos(Math.PI*clamp((g+0.5)/8.5)))/2):1+spring((g-8)/30,-0.45,0,0.55,11);ic.style.transform=`scale(${is})`;ic.style.filter=g<6?`blur(${Math.max(0,(6-g)*0.8)}px)`:'none';ic.style.opacity=clamp((g+1)/2)*(g<2?0.6:1);
    // letters rise
    ltEls.forEach((e,j)=>{const st=(77+j*1.8)/30;const tau=t-st;if(tau<=0){e.style.opacity=0;return}
      const y=spring(tau,70,-500,0.42,13);e.style.opacity=clamp(tau/0.08);e.style.transform=`translateY(${y}px) rotate(${y*0.35}deg)`;e.style.filter=Math.abs(y)>6?`blur(${Math.min(4,Math.abs(y)/14)}px)`:'none'});
    // tagline
    const tg=$('tag');const tp=clamp((f-104.5)/4);tg.style.opacity=tp;tg.style.transform=`translateY(${(1-eOutCubic(tp))*10}px)`;
  }
};
function wordAnim(els,f){
  WORDS.forEach(([w,x,fs],i)=>{const e=els[i];const g=f-fs;if(g<0){e.style.opacity=0;return}
    const s=1+spring(g/30,1.25,0,0.48,15.4);const bl=Math.min(14,Math.abs(s-1)*12);
    const dx=i===4?28*Math.exp(-Math.max(0,g-5)/3)*clamp(g/5):0;
    e.style.opacity=clamp(g/1.6);e.style.transform=`translateX(${dx}px) scale(${s})`;e.style.filter=bl>0.3?`blur(${bl}px)`:'none'});
}
document.fonts.ready.then(()=>window.render(0));
</script></body></html>
