<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'DM Sans'; src: url('kit/brand/fonts/dm-sans-latin.woff2') format('woff2'); font-weight: 100 1000; }
* { box-sizing: border-box; margin: 0; }
html, body { overflow: hidden; background: #f3f6fb; font-family: 'DM Sans', system-ui, sans-serif; }
.a { position: absolute; }
#card { overflow: hidden; background: #fff; box-shadow: 0 24px 60px -16px rgba(15,30,60,.5); }
#card img { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform, opacity; }
.cap { left: 50%; transform: translateX(-50%); text-align: center; color: #fff; background: rgba(15,23,42,.82);
  border-radius: 12px; padding: 10px 20px; font: 600 40px/1.3 'DM Sans'; white-space: normal; width: max-content; }
.pill { display: inline-block; background: #e8f0fe; color: #1d4ed8; font: 600 22px 'DM Sans'; letter-spacing: .05em; text-transform: uppercase; border-radius: 999px; padding: 6px 14px; }
.ttl { color: #0f172a; font: 600 34px 'DM Sans'; }
</style></head>
<body>
<div id="root" class="a" style="left:0;top:0"></div>
<script src="data.js"></script>
<script>
// EMR training walkthrough (Med Spa EMR training style pack). Both cuts from one page: ?fmt=h (1920×1080, default) | ?fmt=v (1080×1920).
// Explainer contract: window.VIDEO, window.seek(t). QA contract: window.STORYBOARD + data-qa (tools/explainer_qa.mjs).
// To make another feature: change FEATURE + STEPS below, measure the kit (targets.json), voice the lines (lines.json → data.js).
const V = new URLSearchParams(location.search).get('fmt') === 'v';

// ---- what this video says and shows (scripting rules: the pack's SCRIPT.md) ----
const FEATURE = { name: 'In-Room', promise: 'Check-in to check-out, from the treatment chair.', path: 'Menu → In-Room' };
const STEPS = [
  { id: 's1', title: 'Open In-Room', line: V ? 's1m' : 's1', file: V ? 'screenshots/mobile/01-open.png' : 'screenshots/desktop/01-open.png' },
  { id: 's2', title: 'Pick the patient', line: 's2', file: V ? 'screenshots/mobile/02-patient.png' : 'screenshots/desktop/02-patient.png' },
  { id: 's3', title: 'Chair-side tools', line: 's3', file: V ? 'screenshots/mobile/03-tiles.png' : 'screenshots/desktop/03-tiles.png' },
];

// ---- pacing (seconds; the pack's pace: brisk, no dead air) ----
const PACE = { introMin: 2.2, introTail: 0.15, whyLead: 0.15, gap: 0.12, voLead: 0.15, clickAt: 0.95, travel: 0.7, zoomIn: 0.7, minHold: 2.0, outLead: 0.2, outTail: 0.5 };

// ---- frame ----
const FW = V ? 1080 : 1920, FH = V ? 1920 : 1080;
const SAFE = V ? { top: 220, right: 60, bottom: 380, left: 60 } : { top: 54, right: 96, bottom: 54, left: 96 };
const NAT = V ? { w: 1170, h: 2532 } : { w: 2880, h: 1800 };                 // the kit's screenshots (390×844 @3x, 1440×900 @2x)
const CARD = V ? { x: 286, y: 312, w: 508, h: 1100, r: 36 } : { x: 320, y: 124, w: 1280, h: 800, r: 18 };
const LABEL = V ? { y: 232 } : { y: 58 };
const CAP_BOTTOM = V ? FH - 1540 : 64;

const C = { accent: '#2563eb', ink: '#0f172a', ink2: '#566173' };
const R = document.getElementById('root'); R.style.cssText += `;width:${FW}px;height:${FH}px`;
document.body.style.cssText = `width:${FW}px;height:${FH}px`;
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
// the house curve, cubic-bezier(.16,1,.3,1), solved for y(x)
function bez(x) { let lo = 0, hi = 1; for (let i = 0; i < 22; i++) { const m = (lo + hi) / 2, bx = 3 * (1 - m) ** 2 * m * .16 + 3 * (1 - m) * m * m * .3 + m ** 3; bx < x ? lo = m : hi = m; } const m = (lo + hi) / 2; return 3 * (1 - m) ** 2 * m + 3 * (1 - m) * m * m + m ** 3; }
const E = (t, t0, d) => bez(cl((t - t0) / d));
function el(p, cls, css, html = '') { const d = document.createElement('div'); d.className = 'a ' + cls; d.style.cssText = css; d.innerHTML = html; p.appendChild(d); return d; }

// ---- timeline, built from the voice clips' real lengths ----
const L = window.LINES;
const T = { introVO: 0.35 };
T.why0 = +Math.max(PACE.introMin, T.introVO + L.intro.dur + PACE.introTail).toFixed(2);
T.whyVO = T.why0 + PACE.whyLead;
const steps = STEPS.map((s, i) => ({ ...s, line: L[s.line] ? s.line : s.line.replace(/m$/, ''), n: i + 1 }));   // phone line falls back to the desktop one
let t = T.whyVO + L.why.dur + PACE.gap;
for (const s of steps) {
  s.t0 = +t.toFixed(2); s.vo = s.t0 + PACE.voLead; s.click = +(s.t0 + PACE.clickAt).toFixed(2);
  s.t1 = +Math.max(s.vo + L[s.line].dur + PACE.gap, s.click + PACE.minHold).toFixed(2);
  const tg = window.TARGETS[s.file]; s.target = tg.target; s.clickPt = tg.click; t = s.t1;
}
T.out0 = t; T.outVO = t + PACE.outLead; const DUR = +(T.outVO + L.outro.dur + PACE.outTail).toFixed(2);
window.VIDEO = { w: FW, h: FH, fps: 30, duration: DUR };
window.STORYBOARD = { safe: SAFE, minHold: PACE.minHold, clear: true,
  steps: steps.map((s) => ({ id: s.id, title: s.title, t0: s.t0, t1: s.t1, click: s.click, target: s.target })) };
window.CUES = [['intro', T.introVO], ['why', T.whyVO], ...steps.map((s) => [s.line, s.vo]), ['outro', T.outVO]];

// ---- the screenshot card (camera inside it); nothing is drawn over it but the cursor ----
const card = el(R, '', `left:${CARD.x}px;top:${CARD.y}px;width:${CARD.w}px;height:${CARD.h}px;border-radius:${CARD.r}px`); card.id = 'card'; card.dataset.qa = 'app';
const imgs = {};
const firstShot = document.createElement('img'); firstShot.src = 'kit/' + STEPS[0].file; firstShot.style.cssText = `width:${NAT.w}px;height:${NAT.h}px`; card.appendChild(firstShot);
for (const s of steps) { const im = document.createElement('img'); im.src = 'kit/' + s.file; im.dataset.qa = 'shot-' + s.id; im.style.cssText = `width:${NAT.w}px;height:${NAT.h}px`; card.appendChild(im); imgs[s.id] = im; }
const base = CARD.w / NAT.w;
function camAt(s, t) {     // zoom 1.4× toward the target as the step starts, back out as it ends; the shot always fills the card
  // zoom up to 1.4× (phone 1.6×), but never so far that the target stops fitting the card with room around it
  const zMax = Math.max(1, Math.min(V ? 1.6 : 1.4, (CARD.w * 0.9) / (s.target.w * base), (CARD.h * 0.8) / (s.target.h * base)));
  const k = Math.min(E(t, s.t0 + 0.05, PACE.zoomIn), 1 - E(t, s.t1 - 0.4, 0.4)), sc = base * lerp(1, zMax, k);
  const fx = s.target.x + s.target.w / 2, fy = s.target.y + s.target.h / 2;
  const tx = cl(CARD.w / 2 - fx * sc, CARD.w - NAT.w * sc, 0), ty = cl(CARD.h / 2 - fy * sc, CARD.h - NAT.h * sc, 0);
  return { sc, tx, ty };
}
const place = (im, c, o) => { im.style.transform = `translate(${c.tx}px,${c.ty}px) scale(${c.sc})`; im.style.opacity = o; };
const scr = (c, p) => [CARD.x + c.tx + p[0] * c.sc, CARD.y + c.ty + p[1] * c.sc];

// ---- pointer: an arrow on desktop, a finger tap on the phone; accent ripple on every click ----
const ripple = el(R, '', `left:0;top:0;width:0;height:0;border-radius:50%;border:4px solid ${C.accent};opacity:0`);
const cursor = V
  ? el(R, '', 'left:0;top:0;width:56px;height:56px;border-radius:50%;background:rgba(15,23,42,.28);border:3px solid #fff;box-shadow:0 6px 16px rgba(15,23,42,.35);opacity:0')
  : el(R, '', 'left:0;top:0;width:44px;height:52px;opacity:0;filter:drop-shadow(0 4px 8px rgba(15,23,42,.35))',
    `<svg width="44" height="52" viewBox="0 0 22 26"><path d="M1.5 1.5 L1.5 20 L6.4 15.6 L9.6 23.2 L13 21.7 L9.9 14.3 L16.4 14.3 Z" fill="#fff" stroke="#0f172a" stroke-width="1.6" stroke-linejoin="round"/></svg>`);
const HOT = V ? [28, 28] : [3, 3];
cursor.dataset.qa = 'cursor'; cursor.dataset.hot = HOT.join(',');

// ---- step label (above the card) and captions (below it) ----
const lt = el(R, '', V ? `left:0;right:0;top:${LABEL.y}px;height:52px;display:flex;justify-content:center;align-items:center;gap:14px;opacity:0`
  : `left:${CARD.x}px;top:${LABEL.y}px;height:52px;display:flex;align-items:center;gap:16px;opacity:0`,
  '<span class="pill" data-qa="read"></span><div class="ttl" data-qa="read"></div>');
const cap = el(R, 'cap', `bottom:${CAP_BOTTOM}px;max-width:${V ? 960 : 1100}px;opacity:0`); cap.dataset.qa = 'caption';
function chunks(line) {           // ≤ 42-character pieces split at natural pauses, timed by the voice's own word stamps
  const out = []; let cur = [], len = 0;
  for (const w of line.words) {
    const add = (len ? 1 : 0) + w[0].length;
    if (cur.length && len + add > 42) { out.push(cur); cur = []; len = 0; }
    cur.push(w); len += (len ? 1 : 0) + w[0].length;
    if (/[,.:;]$/.test(w[0]) && len > 18) { out.push(cur); cur = []; len = 0; }
  }
  if (cur.length) out.push(cur);
  return out.map((ws) => ({ text: ws.map((w) => w[0]).join(' '), a: ws[0][1], b: ws[ws.length - 1][2] }));
}
const CAPS = window.CUES.flatMap(([k, at]) => chunks(L[k]).map((c) => ({ text: c.text, a: at + c.a, b: at + c.b + 0.2 })));
for (let i = 0; i < CAPS.length - 1; i++) if (CAPS[i + 1].a - CAPS[i].b < 0.4) CAPS[i].b = CAPS[i + 1].a;

// ---- intro and outro cards ----
const LOGO = 'kit/brand/logo.png', K = V ? 1.15 : 1;
const intro = el(R, '', `left:0;top:0;width:${FW}px;height:${FH}px;background:linear-gradient(135deg,#73bcdd 0%,#2563eb 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 80px`,
  `<img src="${LOGO}" data-qa="read" style="width:${96 * K}px;height:${96 * K}px;border-radius:24px;box-shadow:0 18px 40px -12px rgba(15,30,60,.45)">
   <div data-qa="read" style="margin-top:34px;color:#fff;font:700 ${56 * K}px 'DM Sans'">${FEATURE.name}</div>
   <div data-qa="read" style="margin-top:14px;color:rgba(255,255,255,.85);font:500 ${30 * K}px/1.35 'DM Sans'">${FEATURE.promise}</div>`);
const outro = el(R, '', `left:0;top:0;width:${FW}px;height:${FH}px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0`,
  `<img src="${LOGO}" data-qa="read" style="width:${72 * K}px;height:${72 * K}px;border-radius:18px">
   <div data-qa="read" style="margin-top:30px;color:${C.ink};font:700 ${56 * K}px 'DM Sans'">You’re all set.</div>
   <div data-qa="read" style="margin-top:16px;color:${C.ink2};font:500 ${30 * K}px 'DM Sans'">${FEATURE.path}</div>
   <div data-qa="read" style="margin-top:28px;color:${C.ink2};font:500 ${26 * K}px 'DM Sans'">Questions? Support &amp; chat in the menu.</div>`);
const kids = (e) => [...e.children];

// ---- one moment ----
function render(t) {
  const io = 1 - E(t, T.why0 - 0.3, 0.4);
  intro.style.opacity = io; intro.style.transform = `scale(${lerp(1.04, 1, io)})`; intro.style.visibility = io < 0.01 ? 'hidden' : 'visible';
  kids(intro).forEach((k, i) => { const e = E(t, 0.1 + i * 0.1, 0.5); k.style.opacity = e; k.style.transform = `translateY(${(1 - e) * 26}px)`; });
  const wk = E(t, T.why0 - 0.3, 1.0), cw = { sc: base * lerp(1.06, 1, wk) };
  cw.tx = (CARD.w - NAT.w * cw.sc) / 2; cw.ty = (CARD.h - NAT.h * cw.sc) / 2;
  place(firstShot, cw, t < steps[0].t0 + 0.4 ? 1 : 0);
  let active = null;
  for (const [i, s] of steps.entries()) {
    const on = t >= s.t0 - 0.05 && t < s.t1 + 0.4;
    if (!on) { imgs[s.id].style.opacity = 0; continue; }
    place(imgs[s.id], camAt(s, t), i === 0 ? E(t, s.t0, 0.3) : E(t, s.t0 - 0.05, 0.3));
    if (t >= s.t0 && t < s.t1) active = s;
  }
  if (active) {
    const c = camAt(active, t), [px, py] = scr(c, active.clickPt);
    const prev = steps[steps.indexOf(active) - 1];
    const from = prev ? scr(camAt(active, active.t0), prev.clickPt) : [FW * 0.62, FH * 0.7];
    const m = E(t, active.click - PACE.travel, PACE.travel - 0.05);
    const x = lerp(from[0], px, m), y = lerp(from[1], py, m);
    const press = Math.exp(-(((t - active.click) / 0.07) ** 2));
    cursor.style.opacity = E(t, active.t0, 0.25) * (1 - E(t, active.t1 - 0.3, 0.25));
    cursor.style.transform = `translate(${x - HOT[0]}px,${y - HOT[1]}px) scale(${1 - 0.12 * press})`;
    const rk = cl((t - active.click) / 0.55);
    ripple.style.opacity = t >= active.click && rk < 1 ? (1 - rk) * 0.9 : 0;
    const rr = 14 + rk * 46; ripple.style.width = ripple.style.height = rr * 2 + 'px';
    ripple.style.transform = `translate(${px - rr}px,${py - rr}px)`;
    lt.children[0].textContent = `Step ${active.n} of ${steps.length}`; lt.children[1].textContent = active.title;
    const lk = E(t, active.t0 + 0.1, 0.35) * (1 - E(t, active.t1 - 0.25, 0.25));
    lt.style.opacity = lk; lt.style.transform = `translateY(${(1 - lk) * 14}px)`;
  } else { cursor.style.opacity = 0; ripple.style.opacity = 0; lt.style.opacity = 0; }
  const ok = E(t, T.out0 - 0.1, 0.4); outro.style.opacity = ok;
  kids(outro).forEach((k, i) => { const e = E(t, T.out0 + i * 0.08, 0.5); k.style.opacity = e; k.style.transform = `translateY(${(1 - e) * 20}px)`; });
  const cc = CAPS.find((c) => t >= c.a - 0.05 && t < c.b);
  if (cc) { if (cap.textContent !== cc.text) cap.textContent = cc.text; cap.style.opacity = 1; } else cap.style.opacity = 0;
}
window.seek = async (t) => { render(t); };
window.render = render;
render(0);
</script>
</body></html>
