<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:ID;src:url(../../../tools/fonts/InterDisplay-Bold.ttf);font-weight:800}
@font-face{font-family:ID;src:url(../../../tools/fonts/InterDisplay-SemiBold.ttf);font-weight:600}
@font-face{font-family:ID;src:url(../../../tools/fonts/InterDisplay-Medium.ttf);font-weight:500}
:root{--bg:#F6F5F2;--ink:#141418;--mut:#6B6F7B;--vio:#7B5CFF;--vio2:#9B83FF;--line:#E6E4EF}
*{box-sizing:border-box;margin:0}
html,body{overflow:hidden;background:var(--bg);font-family:ID}
#stage{position:absolute;inset:0;overflow:hidden;background:var(--bg)}
#darkbg{position:absolute;inset:0;background:radial-gradient(1000px 700px at 65% 45%,rgba(123,92,255,.24),transparent 70%),#0B0B10;opacity:0}
#world{position:absolute;inset:0;transform-origin:50% 45%}
.scene{position:absolute;inset:0;display:none}
.L{position:absolute}
.kick{font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--vio);display:flex;align-items:center;gap:16px}
.kick b{display:inline-grid;place-items:center;border-radius:14px;background:var(--vio);color:#fff;letter-spacing:0}
.h{font-weight:800;letter-spacing:-.037em;line-height:1.0;color:var(--ink)}
.h .l{display:inline-block;white-space:pre}
.h .w{display:inline-block;white-space:nowrap}
.v{color:var(--vio)}
.dark .h{color:#fff}.dark .v{color:var(--vio2)}.dark .kick{color:var(--vio2)}
.sub{font-weight:500;color:var(--mut);line-height:1.35}
.dark .sub{color:#A9ABB8}
.num{font-weight:800;color:var(--vio);letter-spacing:-.05em;line-height:.85}
.R{position:absolute}
.card{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 24px 70px rgba(20,20,40,.11);padding:34px 38px;position:relative;color:var(--ink)}
.dark .card{background:#15151D;border-color:#2A2A38;box-shadow:0 24px 70px rgba(0,0,0,.5);color:#fff}
.ct{font-weight:800;font-size:32px;letter-spacing:-.02em}.cm{font-weight:500;font-size:22px;color:var(--mut)}
.row{display:flex;align-items:center;gap:20px}
.av{width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,#7B5CFF,#B9A8FF);color:#fff;display:grid;place-items:center;font-weight:800;font-size:24px;flex:none}
.bub{background:#F1EEFF;border-radius:18px;padding:20px 24px;font-weight:500;font-size:26px;line-height:1.35;margin-top:18px}
.bub.me{background:var(--vio);color:#fff;margin-left:70px;min-height:76px}
.pill{display:inline-flex;align-items:center;gap:10px;background:var(--vio);color:#fff;font-weight:600;font-size:22px;padding:10px 18px;border-radius:999px;white-space:nowrap}
.pill.g{background:#F1EEFF;color:var(--vio)}
.li{display:flex;align-items:center;gap:20px;padding:17px 14px;border-top:1px solid #EEECF4;font-weight:600;font-size:27px;border-radius:14px}
.dark .li{border-color:#2A2A38}
.li:first-child{border-top-color:transparent}
.ck{width:38px;height:38px;border-radius:50%;background:var(--vio);display:grid;place-items:center;flex:none;position:relative}
.ck0{width:38px;height:38px;border-radius:50%;border:3px solid #DCD7F0;flex:none;position:absolute}
.ckw{position:relative;width:38px;height:38px;flex:none}
.bar{height:12px;border-radius:6px;background:#EEECF4;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--vio);border-radius:6px}
.dark .bar{background:#262634}
.chip{position:absolute;padding:14px 22px;border-radius:14px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:24px;color:#4b4f5b;box-shadow:0 8px 24px rgba(20,20,40,.07);white-space:nowrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}
.tile{aspect-ratio:16/10;border-radius:16px;position:relative;display:flex;align-items:flex-end;padding:14px}
.tile span{background:rgba(20,20,24,.75);color:#fff;font-weight:600;font-size:18px;border-radius:8px;padding:4px 10px}
.badge{position:absolute;font-weight:600;font-size:22px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:12px 20px;box-shadow:0 12px 30px rgba(20,20,40,.10);display:flex;gap:10px;align-items:center;white-space:nowrap;color:var(--ink)}
.dark .badge{background:#1C1C26;border-color:#2A2A38;color:#fff}
.dot{width:12px;height:12px;border-radius:50%;background:var(--vio)}
.p4{display:flex;gap:22px}
.p4 .card{flex:1;padding:28px}
.p4 .n{font-weight:800;font-size:22px;color:var(--vio);letter-spacing:.1em}
.p4 .t{font-weight:800;font-size:36px;letter-spacing:-.03em;margin-top:10px;line-height:1.05}
.cal{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:22px}
.day{border-radius:14px;background:#F7F6FB;min-height:210px;padding:14px;font-weight:600;font-size:20px;color:var(--mut);position:relative}
.ev{position:absolute;left:10px;right:10px;border-radius:10px;padding:10px;font-weight:600;font-size:17px;line-height:1.2;color:#fff;background:var(--vio)}
.ev.b{background:#ECE8FF;color:var(--vio)}
.prompt{border:2px solid var(--line);border-radius:18px;padding:22px 24px;font-weight:500;font-size:27px;line-height:1.35;min-height:130px}
.caret{display:inline-block;width:3px;height:30px;background:var(--vio);vertical-align:-5px;margin-left:2px}
#cap{position:absolute;left:0;right:0;text-align:center;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
#cap span{display:inline-block;margin:0 .14em}
.endwm{font-weight:800;letter-spacing:-.037em;line-height:1.0;color:#fff;text-align:center}
.cta{display:inline-block;background:var(--vio);color:#fff;font-weight:600;border-radius:999px}
#cursor{position:absolute;width:40px;height:40px;display:none;z-index:9}
</style></head><body><div id="stage"><div id="darkbg"></div><div id="world"></div><div id="cap"></div></div>
<script src="lib.js"></script><script src="timing-sales.js"></script><script src="timing-onb.js"></script>
<script src="scenes.js"></script><script src="engine.js"></script></body></html>
