<!doctype html>
<html><head><meta charset="utf-8"><title>Skool launch assets</title>
<link rel="stylesheet" href="../onboarding/build/fonts.css">
<style>
:root{--ink:#0B0F1A;--mut:#6B7280;--line:#E4E6EE;--acc:#2E7DFF;--accs:rgba(46,125,255,.13);--yel:#FFD23F;--navy:#0B0F1A;--ok:#16A34A}
html,body{margin:0;background:#222}
#stage{position:absolute;left:0;top:0;overflow:hidden;font-family:Inter,sans-serif;color:var(--ink)}
#stage *{box-sizing:border-box}
.abs{position:absolute;white-space:nowrap}
.card{position:absolute;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 50px rgba(5,10,30,.22)}
.tight{font-family:'Inter Tight',Inter,sans-serif;font-weight:800;letter-spacing:-.025em}
.serif{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400}
.caps{text-transform:uppercase;letter-spacing:.14em;font-weight:700}
.av{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
.skel{position:absolute;border-radius:6px;background:#ECEEF3}
.dots{display:flex;gap:8px}
</style></head>
<body><div id="stage"></div>
<script src="../onboarding/engine.js"></script>
<script src="assets.js"></script>
</body></html>
