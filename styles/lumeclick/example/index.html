<!doctype html>
<html><head><meta charset="utf-8"><title>LumeClick Starter explainer</title>
<!-- LumeClick: $99/month Starter explainer. Style: LumeClick (base SaaSSuite) + LOOK LIKE "Voice agent SaaS launch" (motion library).
     Explainer contract: window.VIDEO, window.seek(t), window.CUES (voice lines). QA: window.STORYBOARD + data-qa. -->
<style>
@font-face{font-family:IDisp;src:url(fonts/InterDisplay-Bold.ttf);font-weight:700}
@font-face{font-family:IDisp;src:url(fonts/InterDisplay-SemiBold.ttf);font-weight:600}
@font-face{font-family:IDisp;src:url(fonts/InterDisplay-Medium.ttf);font-weight:500}
:root{--navy:#175892;--navy2:#1d5b97;--amber:#f59f0a;--gold:#f9bb3e;--ink:#0b1424;--mute:#6b7280;--line:#e6e8ec;--red:#dc2626;--green:#16a34a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#f4f4f2}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:IDisp,Inter,sans-serif;color:var(--ink);
  background:radial-gradient(1200px 800px at 18% 12%,#fbfbfa 0%,#f4f4f2 55%,#ecebe8 100%)}
.scene{position:absolute;inset:0;will-change:opacity,filter,transform}
.left{position:absolute;left:150px;top:0;bottom:0;width:820px;display:flex;flex-direction:column;justify-content:center}
.eyebrow{align-self:flex-start;display:inline-flex;align-items:center;gap:10px;padding:9px 16px;border:1.5px solid #dfe1e5;border-radius:10px;background:#fff;
  font-weight:600;font-size:21px;letter-spacing:.14em;color:#4b5563;text-transform:uppercase;margin-bottom:26px}
.eyebrow i{width:9px;height:9px;border-radius:50%;background:var(--amber);display:inline-block}
.h{font-weight:700;font-size:104px;line-height:1.02;letter-spacing:-.035em}
.h .ln{display:block;white-space:nowrap}
.w{display:inline-block;margin-right:.24em;will-change:transform,opacity,filter}
.k{color:var(--navy)}
.sub{margin-top:26px;font-weight:500;font-size:38px;color:#6b7280;letter-spacing:-.01em}
.right{position:absolute;left:1030px;right:110px;top:0;bottom:0}
.card{position:absolute;background:#fff;border-radius:30px;box-shadow:0 1px 0 rgba(15,23,42,.04),0 24px 60px -18px rgba(15,23,42,.22),0 8px 20px -10px rgba(15,23,42,.10);will-change:transform,opacity,filter}
.row{position:absolute;background:#fff;border-radius:18px;box-shadow:0 14px 36px -16px rgba(15,23,42,.22);display:flex;align-items:center;gap:18px;padding:18px 24px;will-change:transform,opacity}
.ic{flex:none;display:flex;align-items:center;justify-content:center;border-radius:50%}
.lbl{font-weight:600;font-size:17px;letter-spacing:.14em;color:#9aa1ab;text-transform:uppercase}
.b{font-weight:700}.m{font-weight:500}
.cap{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);background:#fff;border-radius:999px;padding:14px 30px;font-weight:600;font-size:30px;
  box-shadow:0 12px 30px -14px rgba(15,23,42,.30);white-space:nowrap;color:#111827}
.cap .on{color:var(--navy)}
svg{display:block}
</style></head>
<body><div id="stage"></div>
<script src="lib.js"></script><!-- copy of ../lib.js -->
<script src="lines.js"></script>
<script>
const W = 1920, H = 1080, FPS = 30;
const L = window.LINES, ORDER = ["hook", "search", "offer", "site", "gbp", "pipeline", "proof", "proof2", "end"];
// timeline from the voice: each scene starts 0.25 s before its line, line + 0.5 s gap
const GAP = 0.5, START = 0.6, T = {}; let tc = START;
for (const k of ORDER) { T[k] = { v: tc, t0: tc - 0.35, t1: tc + L[k].dur + GAP - 0.35, dur: L[k].dur }; tc += L[k].dur + GAP; }
const DUR = Math.round((tc + 1.4) * 30) / 30;
T.end.t1 = DUR + 1;
window.VIDEO = { w: W, h: H, fps: FPS, duration: DUR };
window.CUES = ORDER.map((k) => [k, T[k].v]);
const { cl, lerp, ease, spring, wordRise } = SS;

// ---------- tiny DOM helpers ----------
const stage = document.getElementById("stage");
const h = (html) => { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstChild; };
const $ = (root, sel) => root.querySelector(sel);
const $$ = (root, sel) => [...root.querySelectorAll(sel)];
const I = {
  phone: (c = "#16a34a", s = 34) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>`,
  missed: (c = "#dc2626", s = 34) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="23" y1="1" x2="17" y2="7"/><line x1="17" y1="1" x2="23" y2="7"/><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>`,
  search: (c = "#6b7280", s = 30) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>`,
  pin: (c = "#dc2626", s = 28) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${c}"><path d="M12 2C8 2 5 5 5 9c0 5 7 13 7 13s7-8 7-13c0-4-3-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z"/></svg>`,
  star: (c = "#f59f0a", s = 24) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${c}"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14l-5-4.87 6.91-1.01z"/></svg>`,
  check: (c = "#fff", s = 20) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
  eyeoff: (c = "#9ca3af", s = 26) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`,
  msg: (c = "#175892", s = 26) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`,
  arrow: (c = "#fff", s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>`,
};
const stars = (n = 5, s = 24) => Array.from({ length: n }, () => I.star("#f59f0a", s)).join("");

// a scene: left headline (eyebrow + 2 lines, one keyword) + right visual. Words rise in, the scene dissolves out.
function headline(eyebrow, lines, sub) {
  return `<div class="left"><div class="eyebrow" data-a="pop" data-d="0"><i></i>${eyebrow}</div><div class="h">${lines.map((l) =>
    `<span class="ln">${l.split(" ").map((w) => w.startsWith("*") ? `<span class="w k">${w.slice(1)}</span>` : `<span class="w">${w}</span>`).join("")}</span>`).join("")}</div>${sub ? `<div class="sub" data-a="rise" data-d="0.5">${sub}</div>` : ""}</div>`;
}
const S = {};
function scene(key, html) { const el = h(`<div class="scene" data-qa="shot-${key}">${html}</div>`); stage.appendChild(el); S[key] = { el, fx: [] }; return el; }

// ---------- 1. hook: missed calls ----------
scene("hook", headline("While you're on a job", ["Every missed call", "is a missed *job."]) + `
<div class="right">
  <div class="card" id="callcard" data-a="pop" data-d="0.15" style="left:150px;top:190px;width:460px;height:430px;text-align:center;padding-top:40px">
    <div class="lbl">Mike's Plumbing · Main line</div>
    <div class="ic" id="ring" style="width:112px;height:112px;margin:34px auto 0;background:#dcfce7">${I.phone("#16a34a", 46)}</div>
    <div class="b" style="font-size:44px;margin-top:30px;letter-spacing:-.01em">(941) 555-0142</div>
    <div class="m" id="callstate" style="font-size:24px;margin-top:10px;color:#16a34a">Incoming call…</div>
  </div>
  <div class="row" data-a="slide" data-d="1.2" style="left:150px;top:650px;width:460px">
    <div class="ic" style="width:46px;height:46px;border-radius:12px;background:#fee2e2">${I.missed("#dc2626", 24)}</div>
    <div style="flex:1"><div class="b" style="font-size:22px">Missed call</div><div class="m" style="font-size:18px;color:#6b7280">Water heater leak</div></div><div class="b" style="font-size:20px;color:#374151">2:14 PM</div></div>
  <div class="row" data-a="slide" data-d="1.55" style="left:162px;top:740px;width:436px;opacity:.95">
    <div class="ic" style="width:46px;height:46px;border-radius:12px;background:#fee2e2">${I.missed("#dc2626", 24)}</div>
    <div style="flex:1"><div class="b" style="font-size:22px">Missed call</div><div class="m" style="font-size:18px;color:#6b7280">AC not cooling</div></div><div class="b" style="font-size:20px;color:#374151">3:02 PM</div></div>
</div>`);
S.hook.fx.push((lt, el) => {
  const missed = lt > 0.95;
  $(el, "#ring").style.background = missed ? "#fee2e2" : "#dcfce7";
  $(el, "#ring").innerHTML = missed ? I.missed("#dc2626", 46) : I.phone("#16a34a", 46);
  const shake = missed ? 0 : Math.sin(lt * 42) * 7 * cl((lt - 0.25) / 0.2);
  $(el, "#ring").style.transform = `rotate(${shake}deg) scale(${missed ? 1 + 0.12 * Math.exp(-(lt - 0.95) * 9) : 1})`;
  const st = $(el, "#callstate"); st.textContent = missed ? "Missed call · 2:14 PM" : "Incoming call…"; st.style.color = missed ? "#dc2626" : "#16a34a";
});

// ---------- 2. search: they call whoever shows up first ----------
scene("search", headline("On Google", ["They call whoever", "shows up *first."]) + `
<div class="right">
  <div class="card" data-a="pop" data-d="0.1" style="left:40px;top:150px;width:700px;height:96px;border-radius:48px;display:flex;align-items:center;gap:20px;padding:0 34px">
    ${I.search("#6b7280", 32)}<div class="m" id="q" style="font-size:30px;color:#111827"></div><div id="caret" style="width:3px;height:36px;background:#175892"></div></div>
  <div class="card" data-a="pop" data-d="1.5" style="left:40px;top:290px;width:700px;height:560px;padding:30px 36px">
    <div class="lbl" style="margin-bottom:10px">Places</div>
    ${[["Bayside Plumbing", "4.8", "(212)"], ["Coastal Pipe Pros", "4.7", "(96)"], ["Gulf Breeze Plumbing", "4.9", "(341)"]].map(([n, r, c], i) => `
    <div class="pl" data-a="slide" data-d="${1.8 + i * 0.16}" style="display:flex;align-items:center;gap:18px;padding:20px 0;border-bottom:1.5px solid #f0f1f3">
      ${I.pin("#dc2626", 30)}<div style="flex:1"><div class="b" style="font-size:26px">${n}</div><div class="m" style="font-size:20px;color:#6b7280;display:flex;align-items:center;gap:6px">${r} ${stars(5, 17)} ${c} · Open now</div></div>
      <div class="b" style="font-size:20px;color:#175892;border:1.5px solid #d6e2ef;border-radius:999px;padding:8px 18px">Call</div></div>`).join("")}
    <div id="you" data-a="slide" data-d="3.1" style="display:flex;align-items:center;gap:18px;padding:22px 0 0">
      ${I.eyeoff("#9ca3af", 30)}<div style="flex:1"><div class="b" style="font-size:26px;color:#9ca3af">Mike's Plumbing</div><div class="m" style="font-size:20px;color:#b4b9c1">Not in the top results</div></div></div>
  </div>
</div>`);
S.search.fx.push((lt, el) => {
  const q = "water heater repair near me", n = cl(Math.floor((lt - 0.4) * 24), 0, q.length);
  $(el, "#q").textContent = q.slice(0, n);
  $(el, "#caret").style.opacity = n < q.length || Math.floor(lt * 2.2) % 2 === 0 ? 1 : 0;
});

// ---------- 3. offer: LumeClick Starter $99/month ----------
scene("offer", headline("LumeClick Starter", ["Get found for", "*$99/month."], "No contracts. Cancel anytime.") + `
<div class="right">
  <div class="card" data-a="pop" data-d="0.15" style="left:120px;top:210px;width:540px;height:600px;padding:44px 48px">
    <img src="logo.png" style="height:44px" alt="LumeClick">
    <div class="lbl" style="margin-top:34px">Starter plan</div>
    <div style="display:flex;align-items:baseline;gap:10px;margin-top:8px"><span class="b" id="price" style="font-size:96px;letter-spacing:-.04em;color:#175892">$99</span><span class="m" style="font-size:30px;color:#6b7280">/ month</span></div>
    <div style="margin-top:26px;border-top:1.5px solid #eef0f3;padding-top:22px">
      ${["SEO-optimized website", "Google Business Profile", "Automated review requests", "Basic setup, done for you"].map((x, i) => `
      <div data-a="slide" data-d="${0.9 + i * 0.22}" style="display:flex;align-items:center;gap:16px;margin:16px 0">
        <div class="ic tick" data-tick="${1.0 + i * 0.22}" style="width:34px;height:34px;background:#175892">${I.check("#fff", 19)}</div><div class="m" style="font-size:27px">${x}</div></div>`).join("")}
    </div>
  </div>
</div>`);

// ---------- 4. site: website that makes the phone ring ----------
scene("site", headline("Step 1 · Your website", ["Built to make", "the phone *ring."]) + `
<div class="right">
  <div class="card" data-a="pop" data-d="0.1" style="left:0;top:180px;width:760px;height:560px;overflow:hidden;border-radius:22px">
    <div style="height:50px;background:#f3f4f6;display:flex;align-items:center;gap:9px;padding:0 20px">${["#f87171", "#fbbf24", "#34d399"].map((c) => `<i style="width:13px;height:13px;border-radius:50%;background:${c};display:inline-block"></i>`).join("")}
      <div class="m" style="margin-left:18px;flex:1;height:30px;border-radius:8px;background:#fff;font-size:16px;color:#6b7280;display:flex;align-items:center;padding:0 14px">mikesplumbing.com</div></div>
    <div data-a="rise" data-d="0.45" style="display:flex;justify-content:space-between;align-items:center;padding:22px 34px"><div class="b" style="font-size:24px;color:#175892">Mike's Plumbing</div>
      <div class="m" style="font-size:17px;color:#6b7280;display:flex;gap:22px"><span>Services</span><span>Reviews</span><span>Contact</span></div></div>
    <div data-a="rise" data-d="0.7" style="padding:24px 34px 0"><div class="b" style="font-size:48px;line-height:1.05;letter-spacing:-.03em">Fast, reliable plumbing<br>in Sarasota.</div>
      <div class="m" style="font-size:20px;color:#6b7280;margin-top:14px">Licensed · Same-day service · 5-star rated</div></div>
    <div id="callbtn" data-a="pop" data-d="1.05" style="position:absolute;left:34px;top:390px;display:inline-flex;align-items:center;gap:12px;background:#175892;color:#fff;border-radius:14px;padding:18px 28px" class="b">
      ${I.phone("#fff", 24)}<span style="font-size:24px">Call (941) 555-0142</span></div>
    <div data-a="rise" data-d="1.3" style="position:absolute;left:34px;top:480px;display:flex;gap:12px">${["Free estimates", "24/7 emergency", "Upfront pricing"].map((x) => `<span class="m" style="font-size:16px;background:#f1f5f9;border-radius:999px;padding:7px 14px;color:#334155">${x}</span>`).join("")}</div>
  </div>
  <div class="card" data-a="pop" data-d="1.6" style="left:600px;top:120px;width:200px;height:200px;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center">
    <svg width="110" height="110" viewBox="0 0 110 110"><circle cx="55" cy="55" r="46" fill="none" stroke="#e5f5ea" stroke-width="10"/><circle id="ring98" cx="55" cy="55" r="46" fill="none" stroke="#16a34a" stroke-width="10" stroke-linecap="round" transform="rotate(-90 55 55)" stroke-dasharray="289" stroke-dashoffset="289"/>
    <text id="n98" x="55" y="66" text-anchor="middle" font-family="IDisp" font-weight="700" font-size="32" fill="#0b1424">0</text></svg>
    <div class="m" style="font-size:18px;color:#6b7280;margin-top:6px">Page speed</div></div>
  <div class="row" data-a="slide" data-d="2.9" style="left:330px;top:780px;width:470px">
    <div class="ic" style="width:50px;height:50px;background:#dcfce7">${I.phone("#16a34a", 24)}</div>
    <div style="flex:1"><div class="b" style="font-size:22px">New call from your website</div><div class="m" style="font-size:18px;color:#6b7280">Drain clog · Lakewood Ranch</div></div><div class="b" style="font-size:20px;color:#16a34a">Now</div></div>
</div>`);
S.site.fx.push((lt, el) => {
  const p = ease.outCubic((lt - 1.8) / 1.1), n = Math.round(98 * p);
  $(el, "#ring98").setAttribute("stroke-dashoffset", String(289 * (1 - 0.98 * p)));
  $(el, "#n98").textContent = String(n);
  const pulse = lt > 3.0 ? 1 + 0.035 * Math.sin((lt - 3.0) * 9) * Math.exp(-(lt - 3.0) * 1.5) : 1;
  $(el, "#callbtn").style.boxShadow = lt > 2.9 ? `0 0 0 ${10 * cl((lt - 2.9) / 0.4) * (1 - cl((lt - 3.3) / 0.8))}px rgba(23,88,146,.18)` : "none";
  $(el, "#callbtn").style.scale = String(pulse);
});

// ---------- 5. gbp: climb the local map ----------
const MAP = [["Bayside Plumbing", "4.8"], ["Coastal Pipe Pros", "4.7"], ["Gulf Breeze Plumbing", "4.9"], ["Suncoast Drain Co.", "4.6"]];
scene("gbp", headline("Step 2 · Google Maps", ["Climb the", "local *map."]) + `
<div class="right">
  <div class="card" data-a="pop" data-d="0.1" style="left:20px;top:150px;width:640px;height:610px;padding:30px 34px">
    <div class="lbl">Plumber near me · Sarasota</div>
    <div id="rank" style="position:relative;height:520px;margin-top:16px">
      ${MAP.map(([n, r], i) => `<div class="mp" data-i="${i}" style="position:absolute;left:0;right:0;height:96px;display:flex;align-items:center;gap:18px;border-bottom:1.5px solid #f0f1f3">
        <div class="b" style="width:34px;font-size:22px;color:#9ca3af">${i + 1}</div><div style="flex:1"><div class="b" style="font-size:25px">${n}</div><div class="m" style="font-size:19px;color:#6b7280;display:flex;align-items:center;gap:6px">${r} ${stars(5, 16)}</div></div></div>`).join("")}
      <div id="me" style="position:absolute;left:-16px;right:-16px;height:96px;display:flex;align-items:center;gap:18px;padding:0 16px;border-radius:18px;background:#fff">
        <div class="b" id="mypos" style="width:34px;font-size:22px;color:#175892">5</div><div style="flex:1"><div class="b" style="font-size:25px;color:#175892">Mike's Plumbing</div>
        <div class="m" style="font-size:19px;color:#6b7280;display:flex;align-items:center;gap:6px"><span id="myr">4.6</span> ${stars(5, 16)} <span id="myc">(12)</span></div></div>
        ${I.pin("#175892", 30)}</div>
    </div>
  </div>
  <div class="card" data-a="pop" data-d="2.4" style="left:470px;top:735px;width:340px;padding:20px 22px;border-radius:22px">
    <div style="display:flex;align-items:center;gap:10px">${I.msg("#175892", 22)}<div class="lbl" style="font-size:14px">Text · after the job</div></div>
    <div class="m" style="font-size:19px;margin-top:10px;line-height:1.35">Thanks for choosing Mike's Plumbing! Mind leaving us a quick review?</div>
    <div id="tap" style="display:flex;gap:4px;margin-top:12px">${stars(5, 28)}</div></div>
</div>`);
S.gbp.fx.push((lt, el) => {
  // Mike climbs from #5 to #1 (spring), the others step down one place
  const p = spring(lt - 1.2, 9, 0.82), slot = (i) => i * 104;
  $$(el, ".mp").forEach((r) => { const i = +r.dataset.i; r.style.transform = `translateY(${slot(i) + 104 * p}px)`; r.querySelector(".b").textContent = String(i + 1 + (p > 0.5 ? 1 : 0)); });
  const me = $(el, "#me"); me.style.transform = `translateY(${lerp(slot(4), slot(0), p)}px)`;
  me.style.boxShadow = `0 ${18 * p}px ${44 * p}px -16px rgba(23,88,146,${0.35 * p})`; me.style.background = p > 0.05 ? "#fff" : "transparent";
  $(el, "#mypos").textContent = String(Math.max(1, 5 - Math.floor(p * 4.05)));
  const rv = cl((lt - 2.8) / 1.6);
