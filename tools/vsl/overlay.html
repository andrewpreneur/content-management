<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:'IT';src:url('__FONTS__/InterTight-ExtraBold.ttf');font-weight:800}
@font-face{font-family:'ITI';src:url('__FONTS__/InterTight-ExtraBoldItalic.ttf');font-weight:800}
@font-face{font-family:'IS';src:url('__FONTS__/InstrumentSerif-Regular.ttf')}
@font-face{font-family:'ISI';src:url('__FONTS__/InstrumentSerif-Italic.ttf')}
@font-face{font-family:'IN';src:url('__FONTS__/Inter-Regular.woff');font-weight:400}
@font-face{font-family:'IN';src:url('__FONTS__/Inter-SemiBold.woff');font-weight:600}
@font-face{font-family:'IN';src:url('__FONTS__/Inter-Bold.woff');font-weight:700}
:root{--navy:#0B0F1A;--panel:#161C2C;--y:#FFD23F;--blue:#2E7DFF;--mut:#A0AABE}
html,body{margin:0;padding:0;background:transparent;overflow:hidden}
#st{position:absolute;left:0;top:0;overflow:hidden}
.abs{position:absolute}
i.acc{font-family:'ISI';font-style:normal;font-weight:400;color:var(--y);letter-spacing:0;padding:0 .04em}
/* background used by cards and motion mode */
.bg{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 40%,#16203A 0%,#0B0F1A 62%,#070A12 100%)}
.bg .grid{position:absolute;inset:-60px;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:64px 64px}
.bg .glow{position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(255,210,63,.13) 0%,rgba(255,210,63,0) 65%)}
.bg .glow2{position:absolute;width:1100px;height:1100px;border-radius:50%;background:radial-gradient(circle,rgba(46,125,255,.16) 0%,rgba(46,125,255,0) 65%)}
.card{position:absolute;overflow:hidden}
.card .design{position:absolute;left:50%;top:50%;transform-origin:50% 50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff}
.kick{font-family:'IN';font-weight:700;font-size:26px;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--blue);padding:10px 22px;border-radius:40px;margin-bottom:34px;display:inline-block}
.kick.y{background:var(--y);color:var(--navy)}
.h{font-family:'IT';font-weight:800;color:#fff;line-height:1.04;letter-spacing:-.015em}
.h i.acc{font-size:1.14em;line-height:.9}
.sub{font-family:'IN';font-weight:600;color:var(--mut);font-size:34px;line-height:1.3;margin-top:26px}
.big{font-family:'IT';font-weight:800;color:#fff;letter-spacing:-.04em;line-height:.9}
.chip{font-family:'IT';font-weight:800;color:#fff;font-size:46px;padding:22px 34px;border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.04));border:1.5px solid rgba(255,255,255,.16);box-shadow:0 18px 50px rgba(0,0,0,.35);margin:12px}
.row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center}
.item{font-family:'IT';font-weight:800;font-size:76px;color:#fff;position:relative;margin:8px 0;padding:0 14px}
.item .bar{position:absolute;left:0;top:52%;height:9px;background:var(--y);border-radius:6px;width:0}
.win{background:#F7F8FB;border-radius:28px;box-shadow:0 40px 120px rgba(0,0,0,.55);overflow:hidden;text-align:left;color:#0B0F1A}
.win .top{height:54px;background:#E9ECF2;display:flex;align-items:center;padding:0 22px;gap:10px}
.win .dot{width:14px;height:14px;border-radius:50%;background:#C9CED8}
.win .url{margin-left:18px;font-family:'IN';font-weight:600;font-size:20px;color:#6B7385;background:#fff;border-radius:10px;padding:6px 16px}
.bars{display:flex;flex-direction:column;gap:26px;width:100%}
.bl{font-family:'IN';font-weight:700;font-size:32px;color:#fff;display:flex;justify-content:space-between;margin-bottom:10px}
.track{height:46px;border-radius:24px;background:rgba(255,255,255,.07);overflow:hidden}
.fill{height:100%;border-radius:24px}
.seat{width:96px;height:96px;border-radius:22px;margin:10px;border:2px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05)}
.dotg{display:grid;gap:9px}
.dotg div{width:22px;height:22px;border-radius:6px;background:rgba(255,255,255,.08)}
.col{flex:1;padding:34px 30px;border-radius:30px;text-align:left}
.col h4{margin:0 0 18px;font-family:'IN';font-weight:700;font-size:26px;letter-spacing:.14em;text-transform:uppercase}
.col p{margin:14px 0;font-family:'IT';font-weight:800;font-size:44px;line-height:1.1}
.btn{font-family:'IT';font-weight:800;color:var(--navy);background:var(--y);border-radius:999px;display:inline-flex;align-items:center;gap:22px;box-shadow:0 20px 60px rgba(255,210,63,.35)}
/* captions */
#cap{position:absolute;left:0;width:100%;text-align:center;font-family:'IT';font-weight:800;color:#fff;white-space:nowrap;z-index:50;
  text-shadow:0 4px 0 rgba(0,0,0,.55),0 0 26px rgba(0,0,0,.65);-webkit-text-stroke:2px rgba(0,0,0,.55);paint-order:stroke fill}
#cap span{display:inline-block;margin:0 .13em}
#cap span.on{color:var(--y)}
#cap span i.acc{-webkit-text-stroke:0}
.hook{position:absolute;left:50%;z-index:40;text-align:center}
.hook .bx{display:inline-block;background:#fff;color:var(--navy);font-family:'IT';font-weight:800;border-radius:22px;box-shadow:0 18px 60px rgba(0,0,0,.45);line-height:1.12}
.hook .bx mark{background:var(--y);color:var(--navy);padding:0 .14em;border-radius:8px}
.l3{position:absolute;z-index:45;display:flex;align-items:stretch}
.l3 .yb{width:10px;background:var(--y);border-radius:4px}
.l3 .tx{background:rgba(11,15,26,.82);backdrop-filter:blur(8px);padding:18px 30px 18px 24px;border-radius:0 18px 18px 0}
.l3 .n{font-family:'IT';font-weight:800;color:#fff}
.l3 .t{font-family:'IN';font-weight:600;color:var(--mut);margin-top:4px}
</style></head><body><div id="st"></div>
<script>
const P=__PLAN__;
const {W,H}=P; const st=document.getElementById('st'); st.style.width=W+'px'; st.style.height=H+'px';
const VERT=H>W*1.2, SQ=!VERT&&H>W*0.9, WIDE=!VERT&&!SQ;
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo=x=>1-Math.pow(1-cl(x),3), eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=x=>{x=cl(x);const c1=1.5,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const pr=(t,s,d)=>cl((t-s)/d);
const rich=s=>String(s).replace(/\*([^*]+)\*/g,'<i class="acc">$1</i>');
const mk=(tag,cls,html,par,css)=>{const d=document.createElement(tag);if(cls)d.className=cls;if(html!=null)d.innerHTML=html;if(css)d.style.cssText=css;(par||st).appendChild(d);return d;};
const fade=(el,v,dy=0,blur=0,sc=1)=>{el.style.opacity=v.toFixed(3);el.style.transform=`translateY(${(dy*(1-v)).toFixed(1)}px) scale(${(sc+(1-sc)*v).toFixed(4)})`;el.style.filter=blur?`blur(${(blur*(1-v)).toFixed(2)}px)`:'';};
function BG(par){const b=mk('div','bg','',par);const g=mk('div','grid','',b);const y=mk('div','glow','',b);const z=mk('div','glow2','',b);
  return t=>{g.style.transform=`translate(${(-(t*6)%64).toFixed(1)}px,${(-(t*4)%64).toFixed(1)}px)`;
    y.style.left=(W*0.62+Math.sin(t*0.35)*W*0.12-450)+'px';y.style.top=(H*0.30+Math.cos(t*0.27)*H*0.08-450)+'px';
    z.style.left=(W*0.25+Math.cos(t*0.22)*W*0.1-550)+'px';z.style.top=(H*0.72+Math.sin(t*0.31)*H*0.06-550)+'px';};}
const ups=[]; // per-frame updaters
let motionBG=null, frameU=null;
if(P.mode==='motion'){const holder=mk('div','','',st,'position:absolute;inset:0');motionBG=BG(holder);
  if(!P.noFrame){const top=mk('div','',`<span class="kick" style="margin:0;font-size:${VERT?26:22}px">${P.series||'ONE FEATURE YOU CAN SELL'}</span>`,st,`position:absolute;left:0;width:100%;text-align:center;top:${VERT?0.075*H:SQ?0.05*H:0.06*H}px;z-index:30`);
   const ft=mk('div','',`<b style="color:#fff">Andrew George</b> · Founder, SaaS<span style="color:#FFD23F">Suite</span>`,st,`position:absolute;left:0;width:100%;text-align:center;bottom:${VERT?0.075*H:0.05*H}px;z-index:30;font-family:'IN';font-weight:600;font-size:${VERT?28:24}px;color:#A0AABE`);
   const pb=mk('div','',null,st,`position:absolute;left:0;bottom:0;height:${VERT?8:6}px;background:#FFD23F;z-index:31`);
   frameU=t=>{pb.style.width=(100*t/P.dur).toFixed(2)+'%';const v=eo(pr(t,0,0.5));top.style.opacity=v;ft.style.opacity=v;};}}

/* ---------- card modules: build(design, ev) -> update(lt, ev) ---------- */
const STAG=0.12;
function stag(els,lt,start=0.15,gap=STAG,dy=34,blur=8){els.forEach((e,i)=>fade(e,eo(pr(lt,start+i*gap,0.45)),dy,blur));}
const M={
 statement(d,e){d.style.width='92%';const k=e.kicker?mk('div','kick'+(e.ky?' y':''),e.kicker,d):null;
   const lines=(e.lines||[e.text]).map(l=>mk('div','h',rich(l),d,`font-size:${e.size||96}px`));const s=e.sub?mk('div','sub',rich(e.sub),d):null;
   const all=[k,...lines,s].filter(Boolean); return lt=>stag(all,lt);},
 stat(d,e){const k=e.kicker?mk('div','kick'+(e.ky?' y':''),e.kicker,d):null;
   const row=mk('div','row','',d,'align-items:baseline');const big=mk('div','big',(e.prefix||'')+Number(e.value).toLocaleString('en-US'),row,`font-size:${e.size||260}px`);
   const suf=e.suffix?mk('div','h','<i class="acc">'+e.suffix+'</i>',row,'font-size:96px;margin-left:12px'):null;
   const lab=e.label?mk('div','h',rich(e.label),d,'font-size:64px;margin-top:18px'):null;const s=e.sub?mk('div','sub',rich(e.sub),d):null;
   const v=+e.value, pre=e.prefix||'', fmt=x=>pre+(e.dec?x.toFixed(e.dec):Math.round(x).toLocaleString('en-US'));
   return lt=>{stag([k,row,lab,s].filter(Boolean),lt);big.textContent=fmt(v*eo(pr(lt,0.2,e.count||0.9)));};},
 chips(d,e){const k=e.kicker?mk('div','kick'+(e.ky?' y':''),e.kicker,d):null;const t=e.title?mk('div','h',rich(e.title),d,`font-size:${e.size||76}px;margin-bottom:30px`):null;
   const row=mk('div','row','',d,'max-width:100%');const cs=e.items.map(x=>mk('div','chip',rich(x),row));
   const f=e.foot?mk('div','h',rich(e.foot),d,'font-size:60px;margin-top:34px'):null;
   return lt=>{stag([k,t].filter(Boolean),lt);const at=i=>e.times?e.times[i]:0.35+i*0.16;cs.forEach((c,i)=>fade(c,back(pr(lt,at(i),0.4)),0,0,0.6));if(f)fade(f,eo(pr(lt,e.foot_at!=null?e.foot_at:at(cs.length-1)+0.3,0.45)),30,8);};},
 strike(d,e){const t=mk('div','h',rich(e.title||"I don't sell"),d,'font-size:58px;color:#A0AABE;margin-bottom:22px');
   const its=e.items.map(x=>{const it=mk('div','item',x,d);const b=mk('div','bar','',it);return [it,b];});
   const fin=e.final?mk('div','h',rich(e.final),d,'font-size:84px;margin-top:30px'):null;
   const gap=e.gap||0.42;
   return lt=>{fade(t,eo(pr(lt,0.1,0.4)),24,6);const at=i=>e.times?e.times[i]:0.2+i*gap;its.forEach(([it,b],i)=>{const a=at(i);fade(it,eo(pr(lt,a,0.35)),26,6);const s=eo(pr(lt,a+0.3,0.25));b.style.width=(s*100)+'%';it.style.opacity=(eo(pr(lt,a,0.35))*(1-0.6*s)).toFixed(3);});
     if(fin){fade(fin,back(pr(lt,e.final_at!=null?e.final_at:at(its.length-1)+0.6,0.45)),0,0,0.7);}};},
 compare(d,e){d.style.width='86%';const t=mk('div','h',rich(e.title),d,`font-size:${e.size||72}px;margin-bottom:56px`);const bars=mk('div','bars','',d);
   const rows=e.bars.map(b=>{const r=mk('div','',null,bars);const l=mk('div','bl',`<span>${b.label}</span><span style="color:${b.hi?'#FFD23F':'#A0AABE'}">${b.value}</span>`,r);const tr=mk('div','track','',r);const f=mk('div','fill','',tr,`background:${b.hi?'linear-gradient(90deg,#FFB800,#FFD23F)':'rgba(160,170,190,.55)'}`);return [r,f,b.pct];});
   return lt=>{fade(t,eo(pr(lt,0.1,0.45)),30,8);rows.forEach(([r,f,p],i)=>{fade(r,eo(pr(lt,0.35+i*0.2,0.4)),20,0);f.style.width=(p*eo(pr(lt,0.5+i*0.35,0.9)))+'%';});};},
 quote(d,e){d.style.width='88%';const q=mk('div','',null,d,"font-family:'ISI';font-size:220px;color:#FFD23F;line-height:.6;height:110px");q.textContent='“';
   const tx=mk('div','',rich(e.text),d,`font-family:'IS';font-size:${e.size||92}px;line-height:1.08;color:#fff`);
   const a=mk('div','sub',e.by,d,'font-size:30px;letter-spacing:.06em;margin-top:34px');
   return lt=>stag([q,tx,a],lt,0.1,0.25);},
 app(d,e){const t=e.title?mk('div','h',rich(e.title),d,'font-size:64px;margin-bottom:34px'):null;
   const w=mk('div','win','',d,`width:${e.w||1100}px`);const tp=mk('div','top','',w);[0,1,2].forEach(()=>mk('div','dot','',tp));mk('div','url',e.url||'app.yourbrand.com',tp);
   const body=mk('div','',null,w,'padding:44px 56px 50px;display:flex;flex-direction:column;align-items:center');
   const lg=mk('div','',`<span style="display:inline-block;width:46px;height:46px;border-radius:12px;background:#0B0F1A;vertical-align:middle;margin-right:14px;box-shadow:inset 0 0 0 6px #FFD23F"></span><span style="vertical-align:middle">${e.brand||'Your Brand'}</span>`,body,"font-family:'IT';font-weight:800;font-size:34px;color:#0B0F1A;margin-bottom:26px");
   const q=mk('div','',e.ask||'What do you want to build?',body,"font-family:'IT';font-weight:800;font-size:44px;color:#0B0F1A;margin-bottom:24px");
   const inp=mk('div','',null,body,"width:100%;box-sizing:border-box;border:2px solid #D5DAE3;border-radius:18px;padding:22px 26px;font-family:'IN';font-weight:600;font-size:30px;color:#0B0F1A;background:#fff;display:flex;align-items:center;justify-content:space-between");
   const typ=mk('span','','',inp);const bt=mk('span','',e.cta||'Build',inp,"font-family:'IT';font-weight:800;font-size:26px;background:#0B0F1A;color:#fff;border-radius:12px;padding:12px 24px");
   const pv=mk('div','',null,body,'width:100%;margin-top:28px;display:flex;flex-direction:column;gap:14px');
   const blocks=[mk('div','',null,pv,'height:110px;border-radius:14px;background:linear-gradient(90deg,#0B0F1A,#24314F)'),mk('div','',null,pv,'display:flex;gap:14px')];
   const cards=[0,1,2].map(()=>mk('div','',null,blocks[1],'flex:1;height:84px;border-radius:12px;background:#E3E7EE'));
   const prompt=e.prompt||'Make me a website for my gym'; const tT=e.type_at||0.7, tD=e.type_dur||1.3;
   return lt=>{if(t)fade(t,eo(pr(lt,0.05,0.4)),24,6);fade(w,eo(pr(lt,0.15,0.5)),60,0,0.94);
     const n=Math.floor(prompt.length*pr(lt,tT,tD));typ.innerHTML=prompt.slice(0,n)+(lt>tT&&lt<tT+tD+0.6&&Math.floor(lt*2.5)%2===0?'<span style="color:#2E7DFF">|</span>':'');
     const press=lt-(tT+tD+0.15);bt.style.transform=`scale(${press>0&&press<0.18?0.9:1})`;bt.style.background=press>0?'#2E7DFF':'#0B0F1A';
     [blocks[0],...cards].forEach((b,i)=>{const v=eo(pr(lt,tT+tD+0.35+i*0.12,0.35));b.style.opacity=v;b.style.transform=`translateY(${(1-v)*16}px)`;});};},
 counter(d,e){const k=e.kicker?mk('div','kick'+(e.ky?' y':''),e.kicker,d):null;const big=mk('div','big',Number(e.value).toLocaleString('en-US')+(e.suffix||''),d,`font-size:${e.size||230}px`);
   const lab=mk('div','h',rich(e.label),d,'font-size:62px;margin:10px 0 36px');const cols=e.cols||20,n=e.dots||300;
   const g=mk('div','dotg','',d,`grid-template-columns:repeat(${cols},22px)`);const ds=[...Array(n)].map(()=>mk('div','','',g));
   return lt=>{stag([k,lab].filter(Boolean),lt);fade(big,eo(pr(lt,0.15,0.4)),30,6);const p=eo(pr(lt,0.3,e.count||1.3));big.textContent=Math.round(+e.value*p).toLocaleString('en-US')+(e.suffix||'');
     const on=Math.round(n*p);ds.forEach((x,i)=>{x.style.background=i<on?'#FFD23F':'rgba(255,255,255,.08)';});fade(g,eo(pr(lt,0.25,0.4)),20,0);};},
 seats(d,e){const t=mk('div','h',rich(e.title),d,'font-size:84px;margin-bottom:34px');const g=mk('div','row','',d,'max-width:620px');
   const ss=[...Array(e.n||15)].map(()=>mk('div','seat','',g));const f=e.foot?mk('div','sub',rich(e.foot),d,'font-size:38px'):null;
   return lt=>{fade(t,eo(pr(lt,0.05,0.4)),30,8);ss.forEach((s,i)=>{fade(s,back(pr(lt,0.25+i*0.05,0.35)),0,0,0.4);const fl=i<(e.taken||0)&&lt>1.1+i*0.08;s.style.background=fl?'#FFD23F':'rgba(255,255,255,.05)';s.style.borderColor=fl?'#FFD23F':'rgba(255,255,255,.18)';});if(f)fade(f,eo(pr(lt,1.0,0.4)),20,6);};},
 versus(d,e){d.style.width='94%';const t=e.title?mk('div','h',rich(e.title),d,'font-size:68px;margin-bottom:40px'):null;const row=mk('div','',null,d,'display:flex;gap:30px;width:100%');
   const mkc=(c,hi)=>{const x=mk('div','col','',row,hi?'background:rgba(255,210,63,.10);border:2px solid rgba(255,210,63,.55)':'background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.12)');
     mk('h4','',c.head,x,`color:${hi?'#FFD23F':'#A0AABE'}`);return [x,c.items.map(s=>mk('p','',rich(s),x,hi?'':'color:rgba(255,255,255,.55)'))];};
   const A=mkc(e.a,false),B=mkc(e.b,true);
   return lt=>{if(t)fade(t,eo(pr(lt,0.05,0.4)),30,8);fade(A[0],eo(pr(lt,0.25,0.4)),40,0);A[1].forEach((p,i)=>fade(p,eo(pr(lt,0.4+i*0.15,0.35)),16,4));
     const b0=e.b_at!=null?e.b_at:0.5+A[1].length*0.15;fade(B[0],eo(pr(lt,b0,0.4)),40,0);B[1].forEach((p,i)=>fade(p,eo(pr(lt,b0+0.15+i*0.15,0.35)),16,4));};},
 cta(d,e){const k=e.kicker?mk('div','kick y',e.kicker,d):null;const t=e.title?mk('div','h',rich(e.title),d,`font-size:${e.size||84}px;margin-bottom:40px`):null;
   const b=mk('div','btn',`<span>${e.button||'Tap the link below'}</span><svg width="44" height="44" viewBox="0 0 24 24"><path d="M12 4v14M5 12l7 7 7-7" stroke="#0B0F1A" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`,d,'font-size:60px;padding:30px 52px');
   const ring=mk('div','',null,d,'position:absolute;border:3px solid #FFD23F;border-radius:999px;pointer-events:none');
   const s=e.sub?mk('div','sub',rich(e.sub),d,'font-size:38px;margin-top:40px'):null;const wm=mk('div','',`SaaS<span style="color:#FFD23F">Suite</span>`,d,"font-family:'IT';font-weight:800;font-size:34px;color:#fff;margin-top:44px;letter-spacing:.02em;opacity:.9");
   return lt=>{stag([k,t].filter(Boolean),lt);fade(b,back(pr(lt,0.3,0.5)),0,0,0.6);const ph=((lt-0.8)%1.4)/1.4;
     ring.style.opacity=lt>0.8?((1-ph)*0.7).toFixed(3):0;const r=b.getBoundingClientRect(),dr=d.getBoundingClientRect(),sc=dr.width/d.offsetWidth;
     const g=ph*28;ring.style.left=((r.left-dr.left)/sc-g)+'px';ring.style.top=((r.top-dr.top)/sc-g)+'px';ring.style.width=(r.width/sc+2*g)+'px';ring.style.height=(r.height/sc+2*g)+'px';
     b.querySelector('svg').style.transform=`translateY(${Math.sin(lt*6)*5}px)`;if(s)fade(s,eo(pr(lt,0.6,0.4)),20,6);fade(wm,eo(pr(lt,0.8,0.4)),10,0);};},
 words(d,e){ // kinetic-lite statement: words of a sentence reveal as spoken (motion mode)
   d.style.width='90%';const k=e.kicker?mk('div','kick'+(e.ky?' y':''),e.kicker,d):null;
   const box=mk('div','h','',d,`font-size:${e.size||(VERT?104:96)}px;line-height:1.08`);
   const ws=e.ws.map(w=>{const s=mk('span','',(w.acc?'<i class="acc">'+w.w+'</i>':w.w),box,'display:inline-block;margin:0 .13em');return [s,w];});
   return (lt,t)=>{if(k)fade(k,eo(pr(lt,0.0,0.35)),20,4);ws.forEach(([s,w])=>{const v=eo(pr(t,w.s-0.06,0.22));s.style.opacity=(0.0+v).toFixed(3);s.style.transform=`translateY(${((1-v)*22).toFixed(1)}px)`;s.style.filter=`blur(${((1-v)*6).toFixed(1)}px)`;});};},
};

/* ---------- card placement ---------- */
function boxFor(layout){
  if(layout==='left') return [0,0,Math.round(W*0.5),H];
  if(layout==='right') return [Math.round(W*0.5),0,Math.round(W*0.5),H];
  if(layout==='top') return [0,0,W,Math.round(H*(P.split||0.5))];
  return [0,0,W,H];
}
const cards=[];
for(const e of (P.events||[]).filter(e=>e.k==='card')){
  const [x,y,w,h]=boxFor(e.layout||'full');
  const c=mk('div','card','',st,`left:${x}px;top:${y}px;width:${w}px;height:${h}px;z-index:${e.z||10}`);
  const bgU=(e.layout&&e.layout!=='full')||P.mode!=='motion'?BG(c):null;
  if(e.layout==='left') mk('div','',null,c,'position:absolute;right:0;top:0;bottom:0;width:2px;background:linear-gradient(transparent,rgba(255,210,63,.6),transparent)');
  if(e.layout==='top') mk('div','',null,c,'position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,rgba(255,210,63,.6),transparent)');
  const base=Math.min(w/1000,h/800)*(e.scale||1); const dw=w/base, dh=h/base;
  const d=mk('div','design','',c,`width:${dw}px;height:${dh}px`);
  const lay=e.layout||'full'; if(lay==='top') d.style.top='45%'; else if(lay==='full'&&P.mode!=='motion') d.style.top='44%';
  d.style.transform=`translate(-50%,-50%) scale(${base})`;
  const inner=mk('div','',null,d,'display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%');
  const up=M[e.type](inner,e);
  cards.push({e,c,up,bgU,inner,d,base,dw,dh,fit:0});
}
function cardVis(t,e){const ti=e.tin==null?0.22:e.tin, to=e.tout==null?0.18:e.tout;return Math.min(cl((t-e.s)/ti),cl((e.e-t)/to));}

/* ---------- hook, lower third, captions ---------- */
const hooks=(P.events||[]).filter(e=>e.k==='hook').map(e=>{const h=mk('div','hook','',st);
  h.style.width=(W*0.9)+"px";const fs=e.size||(VERT?66:SQ?62:60);const bx=mk('div','bx',String(e.text).replace(/\*([^*]+)\*/g,'<mark>$1</mark>'),h,`font-size:${fs}px;padding:${fs*0.42}px ${fs*0.62}px;max-width:${VERT?900:SQ?940:1400}px`);
  h.style.top=(e.y!=null?e.y:(VERT?0.12:SQ?0.08:0.07))*H+'px';return {e,h,bx};});
const l3s=(P.events||[]).filter(e=>e.k==='lower3').map(e=>{const l=mk('div','l3','',st);const s=VERT?1.25:SQ?1.15:1.3;mk('div','yb','',l);
  const tx=mk('div','tx',`<div class="n" style="font-size:${44*s}px">${e.name||'Andrew George'}</div><div class="t" style="font-size:${25*s}px">${e.title||'Founder, SaaSSuite · The One Feature guy'}</div>`,l);
  l.style.left=(VERT?60:SQ?56:90)+'px';l.style.top=(e.y!=null?e.y:(VERT?0.52:SQ?0.56:0.58))*H+'px';return {e,l,tx};});
const capEl=mk('div','','',st);capEl.id='cap';
const capSize=P.capSize||(VERT?78:SQ?70:68), capY=P.capY!=null?P.capY:(VERT?0.665:SQ?0.73:0.80);
capEl.style.fontSize=capSize+'px';
// phrases
const WD=P.words||[]; const phr=[]; {let cur=[];const MAXW=P.capWords||(VERT?3:SQ?3:4), MAXC=VERT?16:SQ?18:26;
  WD.forEach((w,i)=>{const prev=WD[i-1];const len=cur.map(x=>x.w).join(' ').length+w.w.length;
   if(cur.length&&(cur.length>=MAXW||len>MAXC||w.s-prev.e>0.45||/[.?!,;:]$/.test(prev.w)&&cur.length>=2||/[.?!]$/.test(prev.w))){phr.push(cur);cur=[];}cur.push(w);});if(cur.length)phr.push(cur);}
const capHide=(P.events||[]).filter(e=>e.k==='nocap');
const clean=s=>s.replace(/[.,?!;:]+$/,'').replace(/^["']|["']$/g,'');
function caption(t){
  if(P.noCaptions||capHide.some(e=>t>=e.s&&t<e.e)||(P.mode==='motion'&&cards.some(c=>c.e.type==='words'&&t>=c.e.s&&t<c.e.e))){capEl.style.display='none';return;}
  let ph=null;for(const p of phr){if(t>=p[0].s-0.05&&t<=p[p.length-1].e+0.25)ph=p;}
  // keep until next phrase starts if gap small
  if(!ph){capEl.style.display='none';return;}
  capEl.style.display='';const key=ph[0].s;
  if(capEl._k!==key){capEl._k=key;capEl.innerHTML=ph.map(w=>`<span>${w.acc?'<i class="acc">'+clean(w.w)+'</i>':clean(w.w)}</span>`).join('');}
  const sp=capEl.children;ph.forEach((w,i)=>sp[i].classList.toggle('on',t>=w.s-0.03&&t<w.e+0.02&&!w.acc));
  const p=pr(t,ph[0].s-0.05,0.14);
  // move captions when a card covers caption area
  let y=capY;const cc=cards.find(c=>t>=c.e.s&&t<c.e.e);
  if(cc&&cc.e.capY!=null) y=cc.e.capY; else if(cc&&(cc.e.layout||'full')==='full'&&P.mode!=='motion') y=P.capYCard!=null?P.capYCard:(VERT?0.86:SQ?0.86:0.88);
  else if(cc&&cc.e.layout==='left') y=capY;
  capEl.style.top=(y*H-capSize*0.6)+'px';
  let x=0; if(cc&&cc.e.layout==='left') x=W*0.25; capEl.style.left=x+'px';capEl.style.width=(cc&&cc.e.layout==='left'?W*0.75:W)+'px';
  capEl.style.transform=`scale(${(0.9+0.1*back(p)).toFixed(4)})`;capEl.style.opacity=Math.min(1,p*2.5).toFixed(3);
}
window.seek=function(t){
  if(motionBG)motionBG(t); if(frameU)frameU(t);
  for(const c of cards){const v=cardVis(t,c.e);if(v<=0){c.c.style.display='none';continue;}c.c.style.display='';
    if(!c.fit&&document.fonts.status==="loaded"){const cw=Math.max(c.inner.scrollWidth,...[...c.inner.children].map(x=>x.offsetWidth)),ch=c.inner.scrollHeight;const f=Math.min(1,c.dw*0.9/Math.max(1,cw),c.dh*(c.e.layout==='top'?0.80:((c.e.layout||'full')==='full'&&P.mode!=='motion'?0.70:0.8))/Math.max(1,ch));c.fit=f;c.d.style.transform=`translate(-50%,-50%) scale(${c.base*f})`;}
    if(c.bgU)c.bgU(t);const lt=t-c.e.s;
    const tr=c.e.trans||'fade';
    if(tr==='slide'&&(c.e.layout==='left')){c.c.style.opacity=1;c.c.style.transform=`translateX(${(-(1-eio(v))*W*0.5).toFixed(1)}px)`;}
    else if(tr==='slide'&&c.e.layout==='top'){c.c.style.opacity=1;c.c.style.transform=`translateY(${(-(1-eio(v))*H*0.5).toFixed(1)}px)`;}
    else {c.c.style.opacity=eio(v).toFixed(3);c.inner.style.transform=`scale(${(1.035-0.035*eo(cl(lt/0.4))).toFixed(4)})`;}
    c.up(lt,t);}
  for(const h of hooks){const v=Math.min(cl((t-h.e.s)/0.25),cl((h.e.e-t)/0.2));h.h.style.display=v>0?'':'none';if(v>0){h.h.style.opacity=v.toFixed(3);h.h.style.transform=`translateX(-50%) scale(${(0.85+0.15*back(cl((t-h.e.s)/0.35))).toFixed(4)})`;}}
  const anyCard=cards.some(c=>t>=c.e.s-0.05&&t<c.e.e&&c.e.layout!=='left'&&c.e.layout!=='right');
  for(const l of l3s){const a=pr(t,l.e.s,0.45),z=pr(t,l.e.e-0.35,0.35);l.l.style.display=(t>=l.e.s&&t<l.e.e&&!anyCard)?'':'none';
    l.l.style.clipPath=`inset(0 ${((1-eio(a))*100).toFixed(2)}% 0 0)`;l.l.style.opacity=(1-z).toFixed(3);}
  caption(t);
};
window.seek(0);
</script></body></html>
